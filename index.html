    <script>
        var activeUser = null;
        var editingRecipeIndex = null;

        // Elements
        var heroAvatar = document.getElementById('hero-avatar');
        var heroName = document.getElementById('hero-name');
        var heroEmail = document.getElementById('hero-email');
        var statSavedCount = document.getElementById('stat-saved-count');
        var statCreatedCount = document.getElementById('stat-created-count');
        var statReviewsCount = document.getElementById('stat-reviews-count');
        var tabSavedNum = document.getElementById('tab-saved-num');
        var tabCreatedNum = document.getElementById('tab-created-num');
        var savedGrid = document.getElementById('saved-recipes-grid');
        var createdGrid = document.getElementById('created-recipes-grid');
        var navLogoutBtn = document.getElementById('nav-logout-btn');
        var searchSaved = document.getElementById('search-saved');
        var searchCreated = document.getElementById('search-created');
        var settingsAlert = document.getElementById('settings-alert');
        var inputDisplayName = document.getElementById('input-display-name');
        var inputEmailReadonly = document.getElementById('input-email-readonly');
        var profileUpdateForm = document.getElementById('profile-update-form');
        var btnResetPassword = document.getElementById('btn-reset-password');

        // Modal elements
        var recipeModal = document.getElementById('recipe-modal');
        var openAddRecipeModalBtn = document.getElementById('open-add-recipe-modal');
        var closeRecipeModalBtn = document.getElementById('close-recipe-modal');
        var cancelRecipeModalBtn = document.getElementById('cancel-recipe-modal');
        var customRecipeForm = document.getElementById('custom-recipe-form');
        var recipeModalTitle = document.getElementById('recipe-modal-title');

        function escapeHtml(str = '') {
            return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function getAvatarBg(name = 'U') {
            var colors = [
                'linear-gradient(135deg, #00baba, #008f8f)',
                'linear-gradient(135deg, #ff6b6b, #ff8e53)',
                'linear-gradient(135deg, #6E260E, #96351e)',
                'linear-gradient(135deg, #f59e0b, #d97706)',
                'linear-gradient(135deg, #0284c7, #0369a1)'
            ];
            var hash = 0;
            for (var i = 0; i < name.length; i++) hash += name.charCodeAt(i);
            return colors[Math.abs(hash) % colors.length];
        }

        // Debounce Utility
        function debounce(func, wait = 120) {
            var timeout;
            return function (...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        // Tab Switching
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                var target = btn.dataset.tab;
                document.getElementById(target).classList.add('active');
            });
        });

        // Handle URL tab parameter
        var urlParams = new URLSearchParams(window.location.search || (window.location.hash.includes('?') ? window.location.hash.split('?')[1] : ''));
        var initialTab = urlParams.get('tab');
        if (initialTab) {
            var tabBtn = document.querySelector(`.tab-button[data-tab="tab-${initialTab}"]`);
            if (tabBtn) tabBtn.click();
        }

        // Firebase Auth Listener
        if (typeof auth !== 'undefined' && auth) {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    activeUser = user;
                    loadUserProfile(user);
                    loadSavedRecipes();
                    loadCreatedRecipes();
                    calculateReviewsCount();
                } else {
                    var localUser = localStorage.getItem('currentUser');
                    if (!localUser) {
                        window.__navigateTo('signin.html?redirect=profile.html');
                    } else {
                        loadUserProfile({
                            displayName: localUser,
                            email: localStorage.getItem('currentUserEmail') || 'Logged in'
                        });
                        loadSavedRecipes();
                        loadCreatedRecipes();
                        calculateReviewsCount();
                    }
                }
            });
        }

        function loadUserProfile(user) {
            var name = user.displayName || (user.email ? user.email.split('@')[0] : 'Chef');
            heroName.textContent = name;
            heroEmail.textContent = user.email || 'Verified Member';
            heroAvatar.textContent = name.charAt(0).toUpperCase();
            heroAvatar.style.background = getAvatarBg(name);

            inputDisplayName.value = name;
            inputEmailReadonly.value = user.email || '';
        }

        // SAVED RECIPES
        function getSavedRecipesList() {
            var username = localStorage.getItem('currentUser') || (activeUser ? activeUser.displayName : 'default');
            return JSON.parse(localStorage.getItem(`savedRecipes_${username}`)) || [];
        }

        function saveSavedRecipesList(list) {
            var username = localStorage.getItem('currentUser') || (activeUser ? activeUser.displayName : 'default');
            localStorage.setItem(`savedRecipes_${username}`, JSON.stringify(list));
        }

        function loadSavedRecipes() {
            var filter = searchSaved.value.toLowerCase();
            var saved = getSavedRecipesList();

            statSavedCount.textContent = saved.length;
            tabSavedNum.textContent = saved.length;

            var filtered = saved.filter(r =>
                (r.title && r.title.toLowerCase().includes(filter)) ||
                (r.category && r.category.toLowerCase().includes(filter)) ||
                (r.description && r.description.toLowerCase().includes(filter))
            );

            if (filtered.length === 0) {
                savedGrid.innerHTML = `
                <div class="empty-box" style="grid-column: 1 / -1;">
                    <div class="empty-box-icon">🔖</div>
                    <div class="empty-box-title">${saved.length === 0 ? 'No Saved Recipes Yet' : 'No Matching Saved Recipes'}</div>
                    <div class="empty-box-sub">Explore delicious categories and click the heart icon on recipes you love!</div>
                    <a href="index.html#categories" class="primary-action-btn">Browse Categories</a>
                </div>
            `;
                return;
            }

            savedGrid.innerHTML = filtered.map((recipe, index) => {
                var catImgMap = {
                    'Breakfast': 'Breakfast .png',
                    'Lunch': 'Lunch.png',
                    'Dinner': 'Dinner.png',
                    'Cravings': 'Cravings.png',
                    'Appetizers': 'Appetizers .png',
                    'Soups': 'Soups.png',
                    'Desserts': 'Desserts.png',
                    'Beverages': 'Beverages .png'
                };
                var recipeUrl = recipe.url || (recipe.category ? `${recipe.category}.html` : 'index.html');
                var imgPath = recipe.image || catImgMap[recipe.category] || 'Appetizers .png';

                return `
                <div class="recipe-card-item">
                    <div class="card-img-container">
                        <img src="${escapeHtml(imgPath)}" onerror="this.onerror=null; this.src='Appetizers .png';" alt="${escapeHtml(recipe.title)}">
                        <span class="card-category-badge">${escapeHtml(recipe.category || 'Recipe')}</span>
                    </div>
                    <div class="card-body">
                        <h4 class="card-recipe-title">${escapeHtml(recipe.title)}</h4>
                        <p class="card-recipe-desc">${escapeHtml(recipe.description || 'Delicious handcrafted recipe.')}</p>
                        <div class="card-footer-actions">
                            <a href="${escapeHtml(recipeUrl)}" class="btn-view-dish">
                                View Recipe →
                            </a>
                            <button class="btn-action-icon" onclick="removeSavedRecipe(${index})" title="Remove from saved">
                                🗑️ Remove
                            </button>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }

        window.removeSavedRecipe = function (index) {
            if (confirm('Remove this recipe from your saved collection?')) {
                var list = getSavedRecipesList();
                list.splice(index, 1);
                saveSavedRecipesList(list);
                loadSavedRecipes();
            }
        };

        searchSaved.addEventListener('input', debounce(loadSavedRecipes, 120));

        // MY CREATED RECIPES
        function getCreatedRecipesList() {
            return JSON.parse(localStorage.getItem('userRecipes')) || [];
        }

        function saveCreatedRecipesList(list) {
            localStorage.setItem('userRecipes', JSON.stringify(list));
        }

        function loadCreatedRecipes() {
            var filter = searchCreated.value.toLowerCase();
            var created = getCreatedRecipesList();

            statCreatedCount.textContent = created.length;
            tabCreatedNum.textContent = created.length;

            var filtered = created.filter(r =>
                (r.name && r.name.toLowerCase().includes(filter)) ||
                (r.category && r.category.toLowerCase().includes(filter)) ||
                (r.instructions && r.instructions.toLowerCase().includes(filter))
            );

            if (filtered.length === 0) {
                createdGrid.innerHTML = `
                <div class="empty-box" style="grid-column: 1 / -1;">

                    <div class="empty-box-title">${created.length === 0 ? 'No Custom Recipes Added' : 'No Recipes Found'}</div>

                    <button class="primary-action-btn" onclick="openAddRecipeModal()">+ Create Your First Recipe</button>
                </div>
            `;
                return;
            }

            createdGrid.innerHTML = filtered.map((recipe, index) => {
                var imgSrc = recipe.image && recipe.image.trim() ? recipe.image : 'Appetizers .png';
                var cat = recipe.category || 'Custom';

                return `
                <div class="recipe-card-item">
                    <div class="card-img-container">
                        <img src="${escapeHtml(imgSrc)}" onerror="this.onerror=null; this.src='Appetizers .png';" alt="${escapeHtml(recipe.name)}">
                        <span class="card-category-badge">${escapeHtml(cat)}</span>
                    </div>
                    <div class="card-body">
                        <h4 class="card-recipe-title">${escapeHtml(recipe.name)}</h4>
                        <div class="card-meta-pills">
                            <span>🔥 ${escapeHtml(recipe.difficulty || 'Medium')}</span>
                            <span>•</span>
                            <span>🍽️ ${escapeHtml(recipe.mealType || 'Dish')}</span>

                        <p class="card-recipe-desc">${escapeHtml(recipe.instructions || 'Custom recipe instructions.')}</p>

                            <button class="btn-view-dish" onclick="editCustomRecipe(${index})">
                                ✏️ Edit
                            </button>
                            <button class="btn-action-icon" onclick="deleteCustomRecipe(${index})" title="Delete recipe">
                                🗑️ Delete
                            </button>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }

        searchCreated.addEventListener('input', debounce(loadCreatedRecipes, 120));

        // Add / Edit Recipe Modal Handlers
        function openAddRecipeModal() {
            editingRecipeIndex = null;
            recipeModalTitle.textContent = 'Add Your Recipe';
            customRecipeForm.reset();
            recipeModal.classList.add('show');
        }

        window.openAddRecipeModal = openAddRecipeModal;
        openAddRecipeModalBtn.addEventListener('click', openAddRecipeModal);

        closeRecipeModalBtn.addEventListener('click', () => recipeModal.classList.remove('show'));
        cancelRecipeModalBtn.addEventListener('click', () => recipeModal.classList.remove('show'));

        window.editCustomRecipe = function (index) {
            editingRecipeIndex = index;
            var list = getCreatedRecipesList();
            var r = list[index];
            if (!r) return;

            recipeModalTitle.textContent = 'Edit Your Recipe';
            document.getElementById('m-recipe-name').value = r.name || '';
            document.getElementById('m-recipe-category').value = r.category || 'Appetizers';
            document.getElementById('m-recipe-image').value = r.image || '';
            document.getElementById('m-recipe-diff').value = r.difficulty || 'Easy';
            document.getElementById('m-recipe-meal').value = r.mealType || '';
            document.getElementById('m-recipe-instructions').value = r.instructions || '';

            recipeModal.classList.add('show');
        };

        window.deleteCustomRecipe = function (index) {
            if (confirm('Are you sure you want to delete this custom recipe?')) {
                var list = getCreatedRecipesList();
                list.splice(index, 1);
                saveCreatedRecipesList(list);
                loadCreatedRecipes();
            }
        };

        customRecipeForm.addEventListener('submit', (e) => {
            e.preventDefault();
            var name = document.getElementById('m-recipe-name').value.trim();
            var category = document.getElementById('m-recipe-category').value;
            var image = document.getElementById('m-recipe-image').value.trim();
            var difficulty = document.getElementById('m-recipe-diff').value;
            var mealType = document.getElementById('m-recipe-meal').value.trim();
            var instructions = document.getElementById('m-recipe-instructions').value.trim();

            if (!name || !instructions) return;

            var list = getCreatedRecipesList();
            var recipeData = { name, category, image, difficulty, mealType, instructions };

            if (editingRecipeIndex !== null) {
                list[editingRecipeIndex] = recipeData;
            } else {
                list.unshift(recipeData);
            }

            saveCreatedRecipesList(list);
            recipeModal.classList.remove('show');
            loadCreatedRecipes();
        });

        // Total Reviews Calculation
        function calculateReviewsCount() {
            var username = localStorage.getItem('currentUser') || '';
            if (!username) return;

            var total = 0;
            for (var i = 0; i < localStorage.length; i++) {
                var key = localStorage.key(i);
                if (key.startsWith('comments_')) {
                    try {
                        var comments = JSON.parse(localStorage.getItem(key)) || [];
                        total += comments.filter(c => c.name && c.name.toLowerCase() === username.toLowerCase()).length;
                    } catch (e) { }
                }
            }
            statReviewsCount.textContent = total;
        }

        // Account Settings - Update Profile
        profileUpdateForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            var newName = inputDisplayName.value.trim();
            if (!newName) return;

            settingsAlert.className = 'settings-status-alert';
            settingsAlert.textContent = '';

            try {
                if (activeUser && activeUser.updateProfile) {
                    await activeUser.updateProfile({ displayName: newName });
                }
                localStorage.setItem('currentUser', newName);
                loadUserProfile({ displayName: newName, email: activeUser ? activeUser.email : '' });
                settingsAlert.className = 'settings-status-alert success';
                settingsAlert.textContent = 'Profile display name updated successfully!';
            } catch (err) {
                settingsAlert.className = 'settings-status-alert error';
                settingsAlert.textContent = err.message || 'Failed to update profile.';
            }
        });

        // Reset Password
        btnResetPassword.addEventListener('click', async () => {
            var email = activeUser ? activeUser.email : localStorage.getItem('currentUserEmail');
            if (!email) {
                alert('No email found for this account.');
                return;
            }
            try {
                if (typeof auth !== 'undefined' && auth) {
                    await auth.sendPasswordResetEmail(email);
                    settingsAlert.className = 'settings-status-alert success';
                    settingsAlert.textContent = `Password reset email sent to ${email}.`;
                }
            } catch (err) {
                settingsAlert.className = 'settings-status-alert error';
                settingsAlert.textContent = err.message || 'Failed to send reset email.';
            }
        });

        // Logout
        async function handleLogout() {
            if (typeof auth !== 'undefined' && auth) {
                await auth.signOut();
            }
            localStorage.removeItem('currentUser');
            localStorage.removeItem('currentUserEmail');
            localStorage.removeItem('currentUserId');
            window.__navigateTo('index.html');
        }

        navLogoutBtn.addEventListener('click', handleLogout);
    </script>

            clearAlert();
            signinForm.style.display = 'none';
            signupForm.style.display = 'block';
            formTitle.textContent = 'Create Account';
        };

        showSignin.onclick = () => {
            clearAlert();
            signupForm.style.display = 'none';
            signinForm.style.display = 'block';
            formTitle.textContent = 'Sign In';
        };

        continueBtn.onclick = () => {
            window.__navigateTo(redirectUrl);
        };

        // Firebase Auth State Listener
        if (auth) {
            auth.onAuthStateChanged((user) => {
                updateUI(user);
            });
        }

        // Helper to format Firebase errors
        function getFriendlyErrorMessage(error) {
            switch (error.code) {
                case 'auth/invalid-email':
                    return 'Please enter a valid email address.';
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                    return 'Invalid email or password.';
                case 'auth/email-already-in-use':
                    return 'An account with this email already exists.';
                case 'auth/weak-password':
                    return 'Password must be at least 6 characters long.';
                case 'auth/popup-closed-by-user':
                    return 'Sign-in popup was closed before completing.';
                case 'auth/too-many-requests':
                    return 'Too many attempts. Please try again later.';
                default:
                    return error.message || 'An error occurred. Please try again.';
            }
        }

        // Sign In with Email & Password
        document.getElementById('signin-btn').onclick = async () => {
            clearAlert();
            var email = document.getElementById('signin-email').value.trim();
            var password = document.getElementById('signin-password').value;

            if (!email || !password) {
                showAlert('Please enter both email and password.');
                return;
            }

            var btn = document.getElementById('signin-btn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                await auth.signInWithEmailAndPassword(email, password);
                showAlert('Signed in successfully! Redirecting...', false);
                setTimeout(() => {
                    window.__navigateTo(redirectUrl);
                }, 800);
            } catch (error) {
                showAlert(getFriendlyErrorMessage(error));
            } finally {
                btn.disabled = false;
                btn.textContent = 'SIGN IN';
            }
        };

        // Sign Up with Email, Password & Display Name
        document.getElementById('signup-btn').onclick = async () => {
            clearAlert();
            var name = document.getElementById('signup-name').value.trim();
            var email = document.getElementById('signup-email').value.trim();
            var password = document.getElementById('signup-password').value;

            if (!name || !email || !password) {
                showAlert('Please fill in all fields.');
                return;
            }
            if (password.length < 6) {
                showAlert('Password must be at least 6 characters long.');
                return;
            }

            var btn = document.getElementById('signup-btn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                var userCredential = await auth.createUserWithEmailAndPassword(email, password);
                if (userCredential.user) {
                    await userCredential.user.updateProfile({ displayName: name });
                    localStorage.setItem('currentUser', name);
                }
                showAlert('Account created successfully! Redirecting...', false);
                setTimeout(() => {
                    window.__navigateTo(redirectUrl);
                }, 800);
            } catch (error) {
                showAlert(getFriendlyErrorMessage(error));
            } finally {
                btn.disabled = false;
                btn.textContent = 'CREATE ACCOUNT';
            }
        };

        // Sign In with Google
        async function handleGoogleSignIn() {
            clearAlert();
            var provider = new firebase.auth.GoogleAuthProvider();
            try {
                await auth.signInWithPopup(provider);
                showAlert('Signed in with Google! Redirecting...', false);
                setTimeout(() => {
                    window.__navigateTo(redirectUrl);
                }, 800);
            } catch (error) {
                showAlert(getFriendlyErrorMessage(error));
            }
        }

        document.getElementById('google-signin-btn').onclick = handleGoogleSignIn;
        document.getElementById('google-signup-btn').onclick = handleGoogleSignIn;

        // Forgot Password
        forgotPasswordLink.onclick = async () => {
            clearAlert();
            var email = document.getElementById('signin-email').value.trim() || prompt('Enter your email address to reset password:');
            if (!email) return;

            try {
                await auth.sendPasswordResetEmail(email);
                showAlert(`Password reset email sent to ${email}!`, false);
            } catch (error) {
                showAlert(getFriendlyErrorMessage(error));
            }
        };

        // Sign Out
        signOutBtn.onclick = async () => {
            try {
                await auth.signOut();
                showAlert('Signed out successfully.', false);
            } catch (error) {
                showAlert(getFriendlyErrorMessage(error));
            }
        };
    </script>

    </div>

    // Active interval tracking for clean transitions
    const activeIntervals = [];
    const origSetInterval = window.setInterval;
    window.setInterval = function(fn, delay) {
      const id = origSetInterval(fn, delay);
      activeIntervals.push(id);
      return id;
    };
    function clearActiveIntervals() {
      while (activeIntervals.length) {
        clearInterval(activeIntervals.pop());
      }
      document.querySelectorAll('.food, .ripple').forEach(function(el) { el.remove(); });
    }

    // Navigation history state for instant, lag-free back navigation
    var currentActivePage = '';
    window.__previousRoute = 'index.html';

    // Universal global fallback helpers for inline event handlers
    window.goHome = function() {
      window.__navigateTo('index.html');
    };
    window.navigateBack = function() {
      var target = window.__previousRoute || 'index.html';
      window.__navigateTo(target);
    };
    window.toggleDarkMode = function() {
      document.body.classList.toggle('dark');
      localStorage.setItem('darkMode', document.body.classList.contains('dark'));
    };
    window.toggleMode = function() {
      document.body.classList.toggle('dark');
      localStorage.setItem('mode', document.body.classList.contains('dark') ? 'dark' : 'light');
    };

    // Universal navigation function (re-renders if already on route)
    window.__navigateTo = function(url) {
      if (!url) return;
      url = String(url).trim().replace(/^['"]|['"]$/g, '');
      if (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('mailto:') || url.startsWith('tel:')) {
        window.location.href = url;
        return;
      }
      var targetHash = '#' + url;
      if (window.location.hash === targetHash) {
        renderCurrentRoute();
      } else {
        window.location.hash = targetHash;
      }
    };

    // Find template for a page
    function getTemplateForPage(pageName) {
      if (!pageName) return null;
      let cleanName = decodeURIComponent(pageName).trim();
      cleanName = cleanName.replace(/^#/, '').replace(/^\//, '');
      
      const tplId = PAGE_REGISTRY[cleanName] || PAGE_REGISTRY[cleanName.toLowerCase()];
      if (tplId) {
        return document.getElementById(tplId);
      }
      return null;
    }

    // Render active route
    function renderCurrentRoute() {
      clearActiveIntervals();

      let hash = window.location.hash || '';
      if (!hash || hash === '#' || hash === '#/') {
        hash = '#index.html';
      }

      let routeTarget = hash.substring(1);
      // Support query parameters e.g. "signin.html?redirect=profile.html"
      let pageName = routeTarget;
      let queryStr = '';
      const qIdx = routeTarget.indexOf('?');
      if (qIdx !== -1) {
        pageName = routeTarget.substring(0, qIdx);
        queryStr = routeTarget.substring(qIdx + 1);
      }

      // If in-page anchor like "#categories"
      if (!pageName.includes('.html')) {
        const anchorEl = document.getElementById(pageName);
        if (anchorEl) {
          anchorEl.scrollIntoView({ behavior: 'smooth' });
          return;
        }
      }

      // Prevent bounce loops: if unauthenticated user enters profile.html, route to signin immediately
      if (pageName === 'profile.html' && !localStorage.getItem('currentUser')) {
        pageName = 'signin.html';
      }

      // Track last valid browsed route for instant zero-lag back navigation
      if (currentActivePage && currentActivePage !== 'signin.html') {
        if (currentActivePage !== 'profile.html' || localStorage.getItem('currentUser')) {
          window.__previousRoute = currentActivePage;
        }
      }
      currentActivePage = pageName;

      let tpl = getTemplateForPage(pageName);
      if (!tpl) {
        tpl = getTemplateForPage('index.html');
      }
      if (!tpl) return;

      // Update document title
      document.title = tpl.dataset.title || 'TasteMatch';

      // Update body classes and styles
      document.body.className = tpl.dataset.bodyClass || '';
      if (tpl.dataset.bodyStyle) {
        document.body.style.cssText = tpl.dataset.bodyStyle;
      } else {
        document.body.removeAttribute('style');
      }

      // Update active page CSS
      const styleEl = document.getElementById('tm-active-page-style');
      const tplStyle = tpl.content.querySelector('style');
      styleEl.textContent = tplStyle ? tplStyle.textContent : '';

      // Clone content
      const clone = tpl.content.cloneNode(true);

      // Remove style from clone
      const cStyle = clone.querySelector('style');
      if (cStyle) cStyle.remove();

      // Extract scripts to execute sequentially after mount
      const scripts = Array.from(clone.querySelectorAll('script'));
      scripts.forEach(function(s) { s.remove(); });

      // Mount DOM
      const mount = document.getElementById('tm-app-mount');
      mount.innerHTML = '';
      mount.appendChild(clone);

      // Execute scripts in order with isolated exception handling
      scripts.forEach(function(oldScript) {
        try {
          const newScript = document.createElement('script');
          Array.from(oldScript.attributes).forEach(function(attr) {
            newScript.setAttribute(attr.name, attr.value);
          });
          newScript.textContent = oldScript.textContent;
          mount.appendChild(newScript);
        } catch (err) {
          console.error('Route script execution error:', err);
        }
      });

      // Initialize comments module if comments container is present
      if (window.initRecipeComments && mount.querySelector('.comments')) {
        window.initRecipeComments();
      }

      // Re-bind recipe-card data-link clicks if any
      mount.querySelectorAll('.recipe-card[data-link]').forEach(function(card) {
        card.style.cursor = 'pointer';
        card.addEventListener('click', function(e) {
          if (e.target.closest('.favorite-button') || e.target.closest('.delete-button') || e.target.closest('.edit-button')) return;
          const link = card.getAttribute('data-link');
          if (link) window.__navigateTo(link);
        });
      });

      // Scroll to top
      window.scrollTo(0, 0);
    }

    // Intercept clicks on links globally
    document.addEventListener('click', function(e) {
      const a = e.target.closest('a');
      if (!a) return;

      const href = a.getAttribute('href');
      if (!href) return;

      // Allow external links
      if (href.startsWith('http://') || href.startsWith('https://') || href.startsWith('mailto:') || href.startsWith('tel:') || href.startsWith('javascript:')) {
        return;
      }

      // In-page hash on current page
      if (href.startsWith('#')) {
        const targetId = href.substring(1);
        const targetEl = document.getElementById(targetId);
        if (targetEl) {
          e.preventDefault();
          targetEl.scrollIntoView({ behavior: 'smooth' });
          return;
        }
      }

      // Internal page links
      if (href.includes('.html') || PAGE_REGISTRY[href] || PAGE_REGISTRY[href.toLowerCase()]) {
        e.preventDefault();
        window.__navigateTo(href);
      }

    window.addEventListener('hashchange', renderCurrentRoute);
