/* ==========================================================================
   TasteMatch Global Design System & Unified Typography / Header Stylesheet

/* 1. Google Fonts Import (Inter 300..800 + Permanent Marker) */

/* 2. Global CSS Variables / Design Tokens */

  --tm-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --tm-font-accent: 'Permanent Marker', cursive, sans-serif;

  /* Standardized Typography Scale */
  --tm-font-size-xs: 0.75rem;    /* 12px */
  --tm-font-size-sm: 0.875rem;   /* 14px */
  --tm-font-size-base: 1rem;     /* 16px */
  --tm-font-size-md: 1.125rem;   /* 18px */
  --tm-font-size-lg: 1.25rem;    /* 20px */
  --tm-font-size-xl: 1.5rem;     /* 24px - Header Title */
  --tm-font-size-2xl: 1.85rem;   /* 29.6px - Section / Page Heading */
  --tm-font-size-3xl: 2.25rem;   /* 36px */

  /* Header Standard Dimensions */
  --tm-header-height: 68px;
  --tm-header-padding: 14px 20px;
  --tm-header-bg: rgba(234, 221, 202, 0.95);
  --tm-header-border: rgba(0, 0, 0, 0.08);

  --tm-brand-cream: #EADDCA;

  --tm-text-muted: #6b7280;

  /* Transitions */
  --tm-transition-fast: 0.2s ease;
  --tm-transition-normal: 0.3s ease;
}

/* 3. Universal Typography Base */

  <script id="tm-recipe-comments-module">
/**
 * TasteMatch Modern Recipe Comments Module
 * Provides rich comments with avatars, star ratings, timestamps, sorting, likes & authentication sync.
 */

(function () {
    // Dynamic CSS injection if not already linked
    if (!document.querySelector('link[href*="recipe-comments.css"]')) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'recipe-comments.css';
        document.head.appendChild(link);
    }

    // Avatar Color Palette
    const avatarColors = [
        'linear-gradient(135deg, #00baba, #008f8f)',
        'linear-gradient(135deg, #ff6b6b, #ff8e53)',
        'linear-gradient(135deg, #6E260E, #96351e)',
        'linear-gradient(135deg, #f59e0b, #d97706)',
        'linear-gradient(135deg, #0284c7, #0369a1)',
        'linear-gradient(135deg, #7c3aed, #6d28d9)'
    ];

    function getAvatarBg(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        const index = Math.abs(hash) % avatarColors.length;
        return avatarColors[index];
    }

    function timeAgo(timestamp) {
        if (!timestamp) return 'Recently';
        const now = Date.now();
        const seconds = Math.floor((now - timestamp) / 1000);

        if (seconds < 60) return 'Just now';
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h ago`;
        const days = Math.floor(hours / 24);
        if (days < 30) return `${days}d ago`;

        const date = new Date(timestamp);
        return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function escapeHtml(str = '') {
        return String(str)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    window.initRecipeComments = function() {
        const commentContainer = document.querySelector('.comments');
        if (!commentContainer) return;

        const recipeCard = document.querySelector('.recipe-card');
        const recipeId = (recipeCard && recipeCard.dataset.recipe)
            ? recipeCard.dataset.recipe
            : (document.title.split('|')[0].trim() || 'recipe');

        const storageKey = `comments_${recipeId}`;
        let comments = JSON.parse(localStorage.getItem(storageKey)) || [];

        // Migrate old format if needed
        comments = comments.map(c => {
            return {
                id: c.id || ('cm_' + Math.random().toString(36).substr(2, 9)),
                name: c.name || 'Anonymous Chef',
                text: c.text || '',
                rating: c.rating || 0,
                timestamp: c.timestamp || Date.now(),
                likes: c.likes || 0
            };
        });

        let selectedFormRating = 0;
        let currentSort = 'newest';

        function render() {
            // Read active user name from TasteMatch / Firebase session
            const currentUser = localStorage.getItem('currentUser');
            const currentUserEmail = localStorage.getItem('currentUserEmail');

            // Build UI Template
            commentContainer.innerHTML = `
                <div class="comments-wrapper">
                    <div class="comments-header">
                        <h3>
                            Reviews & Comments
                            <span class="comments-count-badge">${comments.length}</span>
                        </h3>
                        ${comments.length > 1 ? `
                        <div class="comments-sort">
                            <label for="tm-sort-select">Sort by:</label>
                            <select id="tm-sort-select">
                                <option value="newest" ${currentSort === 'newest' ? 'selected' : ''}>Newest First</option>
                                <option value="highest" ${currentSort === 'highest' ? 'selected' : ''}>Highest Rating</option>
                                <option value="likes" ${currentSort === 'likes' ? 'selected' : ''}>Most Liked</option>
                            </select>
                        </div>` : ''}
                    </div>

                    <!-- Comment Form -->
                    <div class="tm-comment-form">
                        <div class="tm-user-status">
                            <div class="tm-user-info">
                                <div class="tm-avatar" style="background: ${getAvatarBg(currentUser || 'Guest')}">
                                    ${(currentUser ? currentUser.charAt(0).toUpperCase() : '👤')}
                                </div>
                                <div>
                                    ${currentUser
                    ? `<span><strong>${escapeHtml(currentUser)}</strong></span> <span class="tm-user-tag" style="background:rgba(0,186,186,0.18); color:#007a7a;">✓ Signed In</span>`
                    : `<span>Guest Chef</span> <a href="signin.html?redirect=${encodeURIComponent(window.location.pathname)}" class="tm-signin-link">(Sign in to use your account)</a>`}
                                </div>
                            </div>
                            <div class="tm-form-rating">
                                <span>Your Rating:</span>
                                <div class="tm-stars-picker" id="tm-stars-picker">
                                    <span class="tm-star-choice ${selectedFormRating >= 1 ? 'selected' : ''}" data-val="1">★</span>
                                    <span class="tm-star-choice ${selectedFormRating >= 2 ? 'selected' : ''}" data-val="2">★</span>
                                    <span class="tm-star-choice ${selectedFormRating >= 3 ? 'selected' : ''}" data-val="3">★</span>
                                    <span class="tm-star-choice ${selectedFormRating >= 4 ? 'selected' : ''}" data-val="4">★</span>
                                    <span class="tm-star-choice ${selectedFormRating >= 5 ? 'selected' : ''}" data-val="5">★</span>
                                </div>
                            </div>
                        </div>

                        ${!currentUser ? `
                        <div class="tm-guest-name-group">
                            <input type="text" id="tm-guest-name" class="tm-guest-name-input" placeholder="Your name (optional, defaults to Guest Chef)" maxlength="30">
                        </div>` : ''}

                        <textarea id="tm-comment-input" class="tm-textarea" placeholder="Share your experience with this recipe, cooking tips, or tweaks..." rows="3"></textarea>

                        <div class="tm-form-footer">
                            <span style="font-size: 0.8rem; color: var(--muted, #9ca3af);">
                                ${currentUser ? `Posting as <strong>${escapeHtml(currentUser)}</strong>` : 'Be kind and helpful to fellow food lovers'}
                            </span>
                            <button id="tm-submit-comment" class="tm-post-btn">
                                <span>Post Review</span> ✨
                            </button>
                        </div>
                    </div>

                    <!-- Comments List -->
                    <div class="tm-comments-list" id="tm-comments-list">
                        ${renderCommentListHtml(comments, currentUser)}
                    </div>
                </div>
            `;

            attachEventListeners();
        }

        function renderCommentListHtml(list, currentUser) {
            if (list.length === 0) {
                return `
                    <div class="tm-empty-comments">
                        <div class="tm-empty-icon">🍳 💬</div>
                        <div class="tm-empty-title">No reviews yet</div>
                        <div class="tm-empty-subtitle">Cooked this dish? Be the first to share your rating and tips!</div>
                    </div>
                `;
            }

            // Sort comments
            const sorted = [...list];
            if (currentSort === 'newest') {
                sorted.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            } else if (currentSort === 'highest') {
                sorted.sort((a, b) => (b.rating || 0) - (a.rating || 0));
            } else if (currentSort === 'likes') {
                sorted.sort((a, b) => (b.likes || 0) - (a.likes || 0));
            }

            const likedComments = JSON.parse(localStorage.getItem(`liked_comments_${recipeId}`)) || {};

            return sorted.map((c) => {
                const isLiked = !!likedComments[c.id];
                const starsHtml = c.rating > 0
                    ? `<span class="tm-comment-stars">${'★'.repeat(c.rating)}${'☆'.repeat(5 - c.rating)}</span>`
                    : '';
                const initial = c.name ? c.name.charAt(0).toUpperCase() : '👤';
                const isAuthor = currentUser && currentUser.toLowerCase() === (c.name || '').toLowerCase();

                return `
                    <div class="tm-comment-card" data-id="${c.id}">
                        <div class="tm-comment-header">
                            <div class="tm-comment-author-box">
                                <div class="tm-avatar" style="background: ${getAvatarBg(c.name || 'User')}; width: 34px; height: 34px; font-size: 0.9rem;">
                                    ${initial}
                                </div>
                                <div>
                                    <div class="tm-author-name">
                                        ${escapeHtml(c.name)}
                                        ${isAuthor ? `<span class="tm-user-tag" style="background:rgba(0,186,186,0.18); color:#007a7a;">You</span>` : ''}
                                    </div>
                                    <span class="tm-comment-date">${timeAgo(c.timestamp)}</span>
                                </div>
                            </div>
                            <div class="tm-comment-meta">
                                ${starsHtml}
                            </div>
                        </div>

                        <div class="tm-comment-body">${escapeHtml(c.text)}</div>

                        <div class="tm-comment-actions">
                            <button class="tm-like-btn ${isLiked ? 'liked' : ''}" data-id="${c.id}" title="Helpful review">
                                <span class="tm-heart">${isLiked ? '❤️' : '🤍'}</span>
                                <span class="tm-like-count">${c.likes || 0}</span>
                            </button>

                            <button class="tm-delete-btn" data-id="${c.id}" title="Delete comment">
                                ✕ Delete
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function attachEventListeners() {
            // Stars in form
            const starChoices = commentContainer.querySelectorAll('.tm-star-choice');
            starChoices.forEach(star => {
                star.onmouseenter = () => {
                    const val = parseInt(star.dataset.val);
                    starChoices.forEach(s => s.classList.toggle('hovered', parseInt(s.dataset.val) <= val));
                };
                star.onmouseleave = () => {
                    starChoices.forEach(s => s.classList.remove('hovered'));
                };
                star.onclick = () => {
                    const val = parseInt(star.dataset.val);
                    selectedFormRating = (selectedFormRating === val) ? 0 : val;
                    starChoices.forEach(s => s.classList.toggle('selected', parseInt(s.dataset.val) <= selectedFormRating));
                };
            });

            // Sort Select
            const sortSelect = commentContainer.querySelector('#tm-sort-select');
            if (sortSelect) {
                sortSelect.onchange = (e) => {
                    currentSort = e.target.value;
                    render();
                };
            }

            // Submit Button
            const submitBtn = commentContainer.querySelector('#tm-submit-comment');
            const commentInput = commentContainer.querySelector('#tm-comment-input');
            const guestNameInput = commentContainer.querySelector('#tm-guest-name');

            if (submitBtn && commentInput) {
                submitBtn.onclick = () => {
                    const text = commentInput.value.trim();
                    if (!text) {
                        commentInput.focus();
                        commentInput.style.borderColor = '#ef4444';
                        setTimeout(() => commentInput.style.borderColor = '', 1500);
                        return;
                    }

                    const currentUser = localStorage.getItem('currentUser');
                    let authorName = currentUser;
                    if (!authorName) {
                        authorName = guestNameInput && guestNameInput.value.trim()
                            ? guestNameInput.value.trim()
                            : 'Guest Chef';
                    }

                    const newComment = {
                        id: 'cm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                        name: authorName,
                        text: text,
                        rating: selectedFormRating,
                        timestamp: Date.now(),
                        likes: 0
                    };

                    comments.unshift(newComment);
                    localStorage.setItem(storageKey, JSON.stringify(comments));

                    selectedFormRating = 0;
                    render();
                };
            }

            // Likes
            commentContainer.querySelectorAll('.tm-like-btn').forEach(btn => {
                btn.onclick = () => {
                    const commentId = btn.dataset.id;
                    const likedComments = JSON.parse(localStorage.getItem(`liked_comments_${recipeId}`)) || {};
                    const targetComment = comments.find(c => c.id === commentId);

                    if (targetComment) {
                        if (likedComments[commentId]) {
                            delete likedComments[commentId];
                            targetComment.likes = Math.max(0, (targetComment.likes || 1) - 1);
                        } else {
                            likedComments[commentId] = true;
                            targetComment.likes = (targetComment.likes || 0) + 1;
                        }

                        localStorage.setItem(storageKey, JSON.stringify(comments));
                        localStorage.setItem(`liked_comments_${recipeId}`, JSON.stringify(likedComments));
                        render();
                    }
                };
            });

            // Delete
            commentContainer.querySelectorAll('.tm-delete-btn').forEach(btn => {
                btn.onclick = () => {
                    const commentId = btn.dataset.id;
                    if (confirm('Are you sure you want to remove this comment?')) {
                        comments = comments.filter(c => c.id !== commentId);
                        localStorage.setItem(storageKey, JSON.stringify(comments));
                        render();
                    }
                };
            });
        }

        // Live synchronizer across tabs/pages
        window.addEventListener('storage', (e) => {
            if (e.key === 'currentUser' || e.key === storageKey) {
                comments = JSON.parse(localStorage.getItem(storageKey)) || [];
                render();
            }
        });

        window.addEventListener('authStateChanged', () => {
            render();
        });

        render();
    }

    // Expose global fallback functions for older inline onclick calls
    window.addComment = function () {
        const btn = document.getElementById('tm-submit-comment');
        if (btn) btn.click();
    };
    window.removeComment = function (index) {
        // legacy placeholder
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initRecipeComments);
    } else {
        initRecipeComments();
    }
})();

  </script>

  <div id="addRecipeModal" class="modal" aria-hidden="true">

  <div id="viewRecipeModal" class="modal" aria-hidden="true">

      <span class="close" id="closeViewModal" title="Close">&times;</span>

  <div id="signInModal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="signinTitle">
      <span class="close" id="closeSignIn" title="Close">&times;</span>
      <h3 id="signinTitle">Sign In</h3>
      <form id="signInForm">
        <label for="signinUsername">Username</label>
        <input id="signinUsername" type="text" placeholder="Enter username" required>

        <input id="signinPassword" type="password" placeholder="Password" required>

        <button type="submit" class="btn">Sign In</button>

          style="background: #e74c3c; margin-left:8px; display:none;">Sign Out</button>
      </form>
      <p style="margin-top:12px; color:#444;">(This demo stores a signed-in username locally — no real authentication.)
      </p>
    </div>
  </div>

  <script>
    /************************************************************************
      Elements at data
     ************************************************************************/
    var addRecipeBtn = document.getElementById('addRecipeBtn');
    var addRecipeModal = document.getElementById('addRecipeModal');
    var closeAddModal = document.getElementById('closeAddModal');
    var addRecipeForm = document.getElementById('addRecipeForm');

    var viewRecipeModal = document.getElementById('viewRecipeModal');
    var closeViewModal = document.getElementById('closeViewModal');
    var recipeDetailsEl = document.getElementById('recipeDetails');

    var recipeGrid = document.getElementById('recipeGrid');

    var searchInput = document.getElementById('searchInput');
    var searchButton = document.getElementById('searchButton');

    var profileBtn = document.getElementById('profileBtn');
    var signInModal = document.getElementById('signInModal');
    var closeSignIn = document.getElementById('closeSignIn');
    var signInForm = document.getElementById('signInForm');
    var signOutBtn = document.getElementById('signOutBtn');
    var signinUsernameEl = document.getElementById('signinUsername');

    // user recipes stored in localStorage
    var userRecipes = JSON.parse(localStorage.getItem('userRecipes')) || [];
    // signed user (use shared currentUser from index.html)
    var currentUser = localStorage.getItem('currentUser');

    var editingIndex = null;

    var difficultyFilter = document.getElementById('difficultyFilter');
    var mealTypeFilter = document.getElementById('mealTypeFilter');

    function createRecipeCard(recipe, index = null) {
      var card = document.createElement('div');
      card.className = 'recipe-card';
      var isUser = !recipe.link;

      if (isUser) card.classList.add('user-card');

      var imgSrc = recipe.image && recipe.image.trim() ? recipe.image : 'placeholder.jpg';

      card.innerHTML = `
      <img src="${imgSrc}" alt="${escapeHtml(recipe.name)}">
      <div class="card-content">${escapeHtml(recipe.name)}</div>
      <div class="card-info">
        <div><img src="hat.png" alt=""><span>${isUser ? (recipe.difficulty || '—') : '—'}</span></div>
        <div><span>${isUser ? (recipe.mealType || '—') : '—'}</span></div>
      </div>
      <button class="favorite-button" data-title="${escapeHtml(recipe.name)}" data-desc="${escapeHtml(recipe.instructions || 'No description')}" data-category="Appetizers">${isFavorited(recipe.name) ? '♥' : '♡'}</button>
    `;

      if (isUser) {
        var del = document.createElement('button');
        del.className = 'delete-button';
        del.textContent = 'Delete';
        del.title = 'Delete recipe';
        del.onclick = function (e) {
          e.stopPropagation();
          deleteRecipe(index);
        };
        card.appendChild(del);

        var edit = document.createElement('button');
        edit.className = 'edit-button';
        edit.textContent = 'Edit';
        edit.title = 'Edit recipe';
        edit.onclick = function (e) {
          e.stopPropagation();
          editRecipe(index);
        };
        card.appendChild(edit);

        card.onclick = function () {
          showRecipeDetails({ name: recipe.name, image: imgSrc, instructions: recipe.instructions });
        };
      } else {
        card.dataset.link = recipe.link;
        card.tabIndex = 0;
        card.onclick = () => window.__navigateTo(recipe.link);
        card.onkeypress = (e) => { if (e.key === 'Enter') window.__navigateTo(recipe.link); };
      }

      var favBtn = card.querySelector('.favorite-button');
      favBtn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(favBtn);
      };

      return card;
    }


    function escapeHtml(str = '') {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function reloadUserRecipes() {
      var existingUserCards = Array.from(recipeGrid.querySelectorAll('.recipe-card.user-card'));
      existingUserCards.forEach(el => el.remove());

      userRecipes.forEach((r, i) => {
        var card = createRecipeCard(r, i);
        recipeGrid.appendChild(card);
      });
    }

    /************************************************************************
      Delete recipe
     ************************************************************************/
    function deleteRecipe(index) {
      userRecipes.splice(index, 1);
      localStorage.setItem('userRecipes', JSON.stringify(userRecipes));
      reloadUserRecipes();
    }

    /************************************************************************
      Edit recipe
     ************************************************************************/
    function editRecipe(index) {
      var recipe = userRecipes[index];
      document.getElementById('recipeName').value = recipe.name;
      document.getElementById('recipeImage').value = recipe.image;
      document.getElementById('recipeInstructions').value = recipe.instructions;
      document.getElementById('recipeDifficulty').value = recipe.difficulty || '';
      document.getElementById('recipeMealType').value = recipe.mealType || '';
      document.getElementById('addTitle').textContent = 'Edit Your Recipe';
      editingIndex = index;
      addRecipeModal.style.display = 'flex';
      addRecipeModal.setAttribute('aria-hidden', 'false');
    }

    /************************************************************************
      Favorite functions
     ************************************************************************/
    function isFavorited(title) { var user = localStorage.getItem('currentUser') || currentUser; if (!user) return false;
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];
      return savedRecipes.some(r => r.title === title);
    }

    function toggleFavorite(btn) {
      var user = localStorage.getItem('currentUser') || currentUser;
      if (!user) { window.__navigateTo('signin.html');
        return;
      }
      var title = btn.getAttribute('data-title');
      var desc = btn.getAttribute('data-desc');
      var category = btn.getAttribute('data-category');
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];

      var existingIndex = savedRecipes.findIndex(r => r.title === title);
      if (existingIndex > -1) {
        savedRecipes.splice(existingIndex, 1);
        btn.textContent = '♡';
        btn.classList.remove('favorited');
      } else {
        savedRecipes.push({ title, description: desc, category });
        btn.textContent = '♥';
        btn.classList.add('favorited');
      }
      localStorage.setItem(`savedRecipes_${currentUser}`, JSON.stringify(savedRecipes));
    }

    document.querySelectorAll('.favorite-button').forEach(btn => {
      var title = btn.getAttribute('data-title');
      if (isFavorited(title)) {
        btn.textContent = '♥';
        btn.classList.add('favorited');
      } else {
        btn.textContent = '♡';
        btn.classList.remove('favorited');
      }

      btn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(btn);
      };
    });

    /************************************************************************
      recipe form handler
     ************************************************************************/
    addRecipeBtn.addEventListener('click', () => {
      var user = localStorage.getItem('currentUser') || currentUser;
      if (!user) { window.__navigateTo('signin.html');
        return;
      }
      document.getElementById('addTitle').textContent = 'Add Your Recipe';
      editingIndex = null;
      addRecipeForm.reset();
      openAddModal();
    });

    function openAddModal() {
      addRecipeModal.style.display = 'flex';
      addRecipeModal.setAttribute('aria-hidden', 'false');
    }
    closeAddModal.addEventListener('click', () => {
      addRecipeModal.style.display = 'none';
      addRecipeModal.setAttribute('aria-hidden', 'true');
      addRecipeForm.reset();
      editingIndex = null;
    });

    addRecipeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      var name = document.getElementById('recipeName').value.trim();
      var image = document.getElementById('recipeImage').value.trim();
      var instructions = document.getElementById('recipeInstructions').value.trim();
      var difficulty = document.getElementById('recipeDifficulty').value;
      var mealType = document.getElementById('recipeMealType').value;

      if (!name || !instructions) {
        alert('Please provide at least a recipe name and instructions.');
        return;
      }

      var recipe = { name, image, instructions, difficulty, mealType };
      if (editingIndex !== null) {
        userRecipes[editingIndex] = recipe;
      } else {
        userRecipes.push(recipe);
      }
      localStorage.setItem('userRecipes', JSON.stringify(userRecipes));
      reloadUserRecipes();

      addRecipeModal.style.display = 'none';
      addRecipeForm.reset();
      editingIndex = null;
    });

    /************************************************************************
     recipe ni manong aeron
     ************************************************************************/
    function showRecipeDetails({ name, image, instructions }) {
      var imgSrc = image && image.trim() ? image : 'placeholder.jpg';
      recipeDetailsEl.innerHTML = `
      <img src="${imgSrc}" alt="${escapeHtml(name)}">
      <h3>${escapeHtml(name)}</h3>
      <p>${escapeHtml(instructions || 'No instructions provided.')}</p>
    `;
      viewRecipeModal.style.display = 'flex';
      viewRecipeModal.setAttribute('aria-hidden', 'false');
    }

    closeViewModal.addEventListener('click', () => {
      viewRecipeModal.style.display = 'none';
      viewRecipeModal.setAttribute('aria-hidden', 'true');
      recipeDetailsEl.innerHTML = '';
    });

    function filterRecipes(query) {
      var q = (query || '').trim().toLowerCase();
      var diffFilter = difficultyFilter.value;
      var mealFilter = mealTypeFilter.value;
      var cards = recipeGrid.querySelectorAll('.recipe-card');

      cards.forEach(card => {
        var title = (card.querySelector('.card-content')?.textContent || '').toLowerCase();
        var isUserCard = card.classList.contains('user-card');
        var matches = true;

        if (q && !title.includes(q)) matches = false;

        if (diffFilter) {
          var cardDiff = isUserCard
            ? card.querySelector('.card-info div:first-child span')?.textContent || ''
            : card.getAttribute('data-difficulty') || '';
          if (cardDiff !== diffFilter) matches = false;
        }

        if (mealFilter) {
          var cardMeal = isUserCard
            ? card.querySelector('.card-info div:nth-child(2) span')?.textContent || ''
            : card.getAttribute('data-mealtype') || '';
          if (cardMeal !== mealFilter) matches = false;
        }

        card.style.display = matches ? 'block' : 'none';
      });
    }

    searchButton.addEventListener('click', () => filterRecipes(searchInput.value));
    searchInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') filterRecipes(searchInput.value);
      else filterRecipes(searchInput.value);
    });

    difficultyFilter.addEventListener('change', () => filterRecipes(searchInput.value));
    mealTypeFilter.addEventListener('change', () => filterRecipes(searchInput.value));

    profileBtn.addEventListener('click', () => {
      if (localStorage.getItem('currentUser')) {
        window.__navigateTo('profile.html');
      } else {
        window.__navigateTo('signin.html?redirect=profile.html');
      }
    });

    document.querySelectorAll('.recipe-card[data-link]').forEach(card => {
      var link = card.dataset.link;
      card.addEventListener('click', () => { window.__navigateTo(link); });
      card.addEventListener('keypress', (e) => { if (e.key === 'Enter') window.__navigateTo(link); });
    });

    reloadUserRecipes();

    window.addEventListener('click', (e) => {
      var target = e.target;
      if (target === addRecipeModal) {
        addRecipeModal.style.display = 'none';
        addRecipeModal.setAttribute('aria-hidden', 'true');
        addRecipeForm.reset();
        editingIndex = null;
      }
      if (target === viewRecipeModal) {
        viewRecipeModal.style.display = 'none';
        viewRecipeModal.setAttribute('aria-hidden', 'true');
        recipeDetailsEl.innerHTML = '';
      }
      if (target === signInModal) {
        signInModal.style.display = 'none';
        signInModal.setAttribute('aria-hidden', 'true');
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        [addRecipeModal, viewRecipeModal, signInModal].forEach(mod => {
          if (mod && mod.style.display === 'flex') {
            mod.style.display = 'none';
            mod.setAttribute('aria-hidden', 'true');
          }
        });
      }
    });

    (function preloadPlaceholder() {
      var img = new Image();
      img.src = 'placeholder.jpg';
    })();

  </script>

    </div>
  </template>

  <template id="page-Apple_html" data-page="Apple.html" data-title="Apple Pie | TasteMatch" data-body-class="" data-body-style="">
    <style>

.section { background: rgba(0,0,0,0.03); border-radius: 16px; padding: 30px; }
body.dark .section { background: rgba(255,255,255,0.04); }

ul { list-style: none; }
ul li { padding-left: 26px; margin-bottom: 10px; position: relative; color: var(--muted); }

@media (max-width: 900px) {

</header>

<div class="recipe-container">
<div class="recipe-card" data-recipe="Apple Pie">

    <div class="recipe-hero">
        <div>
            <h2 class="recipe-title">Apple Pie</h2>
            <p class="recipe-description">Apple pie is a classic dessert made with spiced apple filling baked inside a flaky, buttery crust, warm, sweet, and comforting.</p>

            <div class="rating" id="rating">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>

            <div class="badges">
                <span class="badge">⏱ 20 mins</span>
                <span class="badge">🍽 Serves 1</span>
                <span class="badge">🔥 Easy</span>
            </div>

        <img src="Apple pie.png" alt="Apple Pie">
    </div>

    <div class="recipe-content">
        <div class="section">
            <h3>Ingredients</h3>
            <ul>
                 <li>2 cups all-purpose flour</li>
                        <li>1 teaspoon salt</li>
                        <li>2/3 cup shortening</li>
                        <li>4-6 tablespoons ice water</li>
                        <li>6 cups peeled and sliced apples</li>
                        <li>3/4 cup sugar</li>
                        <li>1 tablespoon lemon juice</li>
                        <li>1/2 teaspoon ground cinnamon</li>
                        <li>1 tablespoon butter</li>
            </ul>
        </div>

        <div class="section">
            <h3>Instructions</h3>
            <ol>
             <li>Preheat oven to 425°F (220°C). In a bowl, combine flour and salt. Cut in shortening until the mixture resembles coarse crumbs.</li>
                        <li>Add ice water, 1 tablespoon at a time, until dough forms. Roll out half of the dough and place it in a 9-inch pie dish.</li>
                        <li>In a separate bowl, mix apples, sugar, lemon juice, and cinnamon. Pour the mixture into the pie crust.</li>
                        <li>Dot the top of the filling with butter and cover with the second dough layer. Crimp the edges and cut slits on top to allow steam to escape.</li>
                        <li>Bake for 45-50 minutes or until golden brown. Let cool before serving.</li>
                        
            </ol>
        </div>

</div>
</div>

<script>
/* DARK MODE */
window.toggleDarkMode = function toggleDarkMode() {

    document.body.classList.toggle("dark");
    localStorage.setItem("darkMode", document.body.classList.contains("dark"));
}
if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark");
}

/* NAMESPACE RECIPE ID */
var recipeCard = document.querySelector(".recipe-card");
var recipeId = recipeCard.dataset.recipe;

/* STAR RATING */
var stars = document.querySelectorAll(".star");
var rating = localStorage.getItem(`rating_${recipeId}`) || 0;

function updateStars(value) {
    stars.forEach(star => {
        star.classList.toggle("active", star.dataset.value <= value);
    });
}

stars.forEach(star => {
    star.addEventListener("click", () => {
        rating = star.dataset.value;
        localStorage.setItem(`rating_${recipeId}`, rating);
        updateStars(rating);
    });
});

updateStars(rating);

</script>

    .add-recipe-button {

      transform: translateY(-50%);
      right: 20px;
      background: #ff7f50;

      padding: 9px 16px;

      border-radius: 8px;
      cursor: pointer;

    /* ===========================
       GLOWING SECTION TITLE
    ============================ */
    .section-title {
      font-size: 1.85rem;
      font-weight: 800;

      margin-top: 40px;

        0 0 10px rgba(255, 255, 255, 0.35),

    .section-title::after {
      content: "";

    /* ===========================
       SEARCH BAR
    ============================ */
    .search-wrap {

    }

    .search-input {
      padding: 12px 14px;

    }

    .search-button {
      padding: 12px 18px;
      border-radius: 0 12px 12px 0;

      background: linear-gradient(90deg, var(--accent-start), var(--accent-end));

      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
      margin-left: -2px;
    }

    .search-button:hover {
      filter: brightness(.96);
      transform: translateY(-1px);
    }

    /* ===========================
       serep 
    ============================ */
    .recipe-grid {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 36px;
      padding: 36px 18px 80px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ===========================
       RECIPE CARDs 
    ============================ */
    .recipe-card {
      width: var(--card-width);
      height: var(--card-height);
      border-radius: 22px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition:
        transform 0.45s ease,
        filter 0.45s ease,
        box-shadow 0.45s ease;
    }

    .recipe-card:hover {
      transform: translateY(-10px) scale(1.03);
      filter: brightness(1.07);
      box-shadow: 0 26px 50px rgba(0, 0, 0, 0.45);
    }

    .recipe-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      position: relative;
      z-index: 1;
      transition: transform .5s ease;
    }

    .recipe-card:hover img {
      transform: scale(1.12);
    }

    .recipe-card::before {
      content: "";
      position: absolute;
      top: -150%;
      left: -150%;
      width: 280%;
      height: 280%;
      background: linear-gradient(120deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.4) 45%,
          rgba(255, 255, 255, 0) 80%);
      transform: rotate(25deg);
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
      z-index: 3;
    }

    .recipe-card:hover::before {
      opacity: 1;
      animation: shineSweep 1s ease forwards;
    }

    @keyframes shineSweep {
      from {
        transform: translate(-50%, -50%) rotate(25deg);
      }

      to {
        transform: translate(60%, 60%) rotate(25deg);
      }
    }

    .recipe-card::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0));
      z-index: 2;
    }

    /* card text */
    .card-content {
      position: absolute;
      bottom: 70px;
      left: 25px;
      right: 25px;
      color: white;
      font-size: 1.4rem;
      font-weight: 600;
      line-height: 1.2;
      text-shadow: 0px 3px 6px rgba(0, 0, 0, 0.45);
      z-index: 4;
    }

    .card-info {
      position: absolute;
      bottom: 18px;
      left: 25px;
      display: flex;
      gap: 20px;
      z-index: 4;
      align-items: center;
    }

    .card-info div {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .card-info img {
      width: 20px;
      height: 20px;
      object-fit: cover;
    }

    /* Favorite button */
    .favorite-button {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.8);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: background 0.3s;
    }

    .favorite-button:hover {
      background: rgba(255, 255, 255, 1);
    }

    .favorite-button.favorited {
      color: #ff6347;
    }

    .delete-button {
      position: absolute;
      top: 12px;
      right: 12px;
      background-color: rgba(231, 76, 60, 0.95);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: 700;
      z-index: 6;
      display: none;
    }

    .recipe-card.user-card:hover .delete-button {
      display: block;
      transform: translateY(-2px);
    }

    .edit-button {
      position: absolute;
      top: 12px;
      right: 70px;
      background-color: rgba(52, 152, 219, 0.95);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: 700;
      z-index: 6;
      display: none;
    }

    .recipe-card.user-card:hover .edit-button {
      display: block;
      transform: translateY(-2px);
    }

    .back-button {
      display: block;
      width: fit-content;
      margin: 32px auto 80px;
      background-color: #e74c3c;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .back-button:hover {
      background-color: #c0392b;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.5);

    .modal-content {
      background-color: #fff;
      color: #111;
      margin: 20px;

    .modal .close {

    .modal form input[type="text"],

    .modal form button[type="submit"],
    .modal .btn {

    .recipe-details img {

    .recipe-details h3 {

    @media (max-width: 980px) {
      .card-content {
        font-size: 1.1rem;
        bottom: 60px;

        width: 360px;
        height: 250px;
        border-radius: 18px;

    @media (max-width: 640px) {
      header {
        padding: 12px 14px;

      header h1 {
        font-size: 1.15rem;

      }

      .card-info {
        left: 18px;

      }
    }

    .filter-controls {
      display: flex;
      justify-content: center;

    .filter-controls select {

    </style>

          style="background: #e74c3c; margin-left:8px; display:none;">Sign Out</button>

  <script>
    /************************************************************************
      Elements at data
     ************************************************************************/
    var addRecipeBtn = document.getElementById('addRecipeBtn');
    var addRecipeModal = document.getElementById('addRecipeModal');
    var closeAddModal = document.getElementById('closeAddModal');
    var addRecipeForm = document.getElementById('addRecipeForm');

    var viewRecipeModal = document.getElementById('viewRecipeModal');
    var closeViewModal = document.getElementById('closeViewModal');
    var recipeDetailsEl = document.getElementById('recipeDetails');

    var recipeGrid = document.getElementById('recipeGrid');

    var searchInput = document.getElementById('searchInput');
    var searchButton = document.getElementById('searchButton');

    var profileBtn = document.getElementById('profileBtn');
    var signInModal = document.getElementById('signInModal');
    var closeSignIn = document.getElementById('closeSignIn');
    var signInForm = document.getElementById('signInForm');
    var signOutBtn = document.getElementById('signOutBtn');
    var signinUsernameEl = document.getElementById('signinUsername');

    // user recipes stored in localStorage
    var userRecipes = JSON.parse(localStorage.getItem('userRecipes')) || [];
    // signed user (use shared currentUser from index.html)
    var currentUser = localStorage.getItem('currentUser');

    var editingIndex = null;

    var difficultyFilter = document.getElementById('difficultyFilter');
    var mealTypeFilter = document.getElementById('mealTypeFilter');

    function createRecipeCard(recipe, index = null) {
      var card = document.createElement('div');
      card.className = 'recipe-card';
      var isUser = !recipe.link;

      if (isUser) card.classList.add('user-card');

      var imgSrc = recipe.image && recipe.image.trim() ? recipe.image : 'placeholder.jpg';

      card.innerHTML = `
      <img src="${imgSrc}" alt="${escapeHtml(recipe.name)}">
      <div class="card-content">${escapeHtml(recipe.name)}</div>
      <div class="card-info">
        <div><img src="hat.png" alt=""><span>${isUser ? (recipe.difficulty || '—') : '—'}</span></div>
        <div><span>${isUser ? (recipe.mealType || '—') : '—'}</span></div>
      </div>
      <button class="favorite-button" data-title="${escapeHtml(recipe.name)}" data-desc="${escapeHtml(recipe.instructions || 'No description')}" data-category="Appetizers">${isFavorited(recipe.name) ? '♥' : '♡'}</button>
    `;

      if (isUser) {
        var del = document.createElement('button');
        del.className = 'delete-button';
        del.textContent = 'Delete';
        del.title = 'Delete recipe';
        del.onclick = function (e) {
          e.stopPropagation();
          deleteRecipe(index);
        };
        card.appendChild(del);

        var edit = document.createElement('button');
        edit.className = 'edit-button';
        edit.textContent = 'Edit';
        edit.title = 'Edit recipe';
        edit.onclick = function (e) {
          e.stopPropagation();
          editRecipe(index);
        };
        card.appendChild(edit);

        card.onclick = function () {
          showRecipeDetails({ name: recipe.name, image: imgSrc, instructions: recipe.instructions });
        };
      } else {
        card.dataset.link = recipe.link;
        card.tabIndex = 0;
        card.onclick = () => window.__navigateTo(recipe.link);
        card.onkeypress = (e) => { if (e.key === 'Enter') window.__navigateTo(recipe.link); };
      }

      var favBtn = card.querySelector('.favorite-button');
      favBtn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(favBtn);
      };

      return card;
    }


    function escapeHtml(str = '') {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function reloadUserRecipes() {
      var existingUserCards = Array.from(recipeGrid.querySelectorAll('.recipe-card.user-card'));
      existingUserCards.forEach(el => el.remove());

      userRecipes.forEach((r, i) => {
        var card = createRecipeCard(r, i);
        recipeGrid.appendChild(card);
      });
    }

    /************************************************************************
      Delete recipe
     ************************************************************************/
    function deleteRecipe(index) {
      userRecipes.splice(index, 1);
      localStorage.setItem('userRecipes', JSON.stringify(userRecipes));
      reloadUserRecipes();
    }

    /************************************************************************
      Edit recipe
     ************************************************************************/
    function editRecipe(index) {
      var recipe = userRecipes[index];
      document.getElementById('recipeName').value = recipe.name;
      document.getElementById('recipeImage').value = recipe.image;
      document.getElementById('recipeInstructions').value = recipe.instructions;
      document.getElementById('recipeDifficulty').value = recipe.difficulty || '';
      document.getElementById('recipeMealType').value = recipe.mealType || '';
      document.getElementById('addTitle').textContent = 'Edit Your Recipe';
      editingIndex = index;
      addRecipeModal.style.display = 'flex';
      addRecipeModal.setAttribute('aria-hidden', 'false');
    }

    /************************************************************************
      Favorite functions
     ************************************************************************/
    function isFavorited(title) { var user = localStorage.getItem('currentUser') || currentUser; if (!user) return false;
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];
      return savedRecipes.some(r => r.title === title);
    }

    function toggleFavorite(btn) {
      var user = localStorage.getItem('currentUser') || currentUser;
      if (!user) { window.__navigateTo('signin.html');
        return;
      }
      var title = btn.getAttribute('data-title');
      var desc = btn.getAttribute('data-desc');
      var category = btn.getAttribute('data-category');
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];

      var existingIndex = savedRecipes.findIndex(r => r.title === title);
      if (existingIndex > -1) {
        savedRecipes.splice(existingIndex, 1);
        btn.textContent = '♡';
        btn.classList.remove('favorited');
      } else {
        savedRecipes.push({ title, description: desc, category });
        btn.textContent = '♥';
        btn.classList.add('favorited');
      }
      localStorage.setItem(`savedRecipes_${currentUser}`, JSON.stringify(savedRecipes));
    }

    document.querySelectorAll('.favorite-button').forEach(btn => {
      var title = btn.getAttribute('data-title');
      if (isFavorited(title)) {
        btn.textContent = '♥';
        btn.classList.add('favorited');
      } else {
        btn.textContent = '♡';
        btn.classList.remove('favorited');
      }

      btn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(btn);
      };
    });

    /************************************************************************
      recipe form handler
     ************************************************************************/
    addRecipeBtn.addEventListener('click', () => {
      var user = localStorage.getItem('currentUser') || currentUser;
      if (!user) { window.__navigateTo('signin.html');
        return;
      }
      document.getElementById('addTitle').textContent = 'Add Your Recipe';
      editingIndex = null;
      addRecipeForm.reset();
      openAddModal();
    });

    function openAddModal() {
      addRecipeModal.style.display = 'flex';
      addRecipeModal.setAttribute('aria-hidden', 'false');
    }
    closeAddModal.addEventListener('click', () => {
      addRecipeModal.style.display = 'none';
      addRecipeModal.setAttribute('aria-hidden', 'true');
      addRecipeForm.reset();
      editingIndex = null;
    });

    addRecipeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      var name = document.getElementById('recipeName').value.trim();
      var image = document.getElementById('recipeImage').value.trim();
      var instructions = document.getElementById('recipeInstructions').value.trim();
      var difficulty = document.getElementById('recipeDifficulty').value;
      var mealType = document.getElementById('recipeMealType').value;

      if (!name || !instructions) {
        alert('Please provide at least a recipe name and instructions.');
        return;
      }

      var recipe = { name, image, instructions, difficulty, mealType };
      if (editingIndex !== null) {
        userRecipes[editingIndex] = recipe;
      } else {
        userRecipes.push(recipe);
      }
      localStorage.setItem('userRecipes', JSON.stringify(userRecipes));
      reloadUserRecipes();

      addRecipeModal.style.display = 'none';
      addRecipeForm.reset();
      editingIndex = null;
    });

    /************************************************************************
     recipe ni manong aeron
     ************************************************************************/
    function showRecipeDetails({ name, image, instructions }) {
      var imgSrc = image && image.trim() ? image : 'placeholder.jpg';
      recipeDetailsEl.innerHTML = `
      <img src="${imgSrc}" alt="${escapeHtml(name)}">
      <h3>${escapeHtml(name)}</h3>
      <p>${escapeHtml(instructions || 'No instructions provided.')}</p>
    `;
      viewRecipeModal.style.display = 'flex';
      viewRecipeModal.setAttribute('aria-hidden', 'false');
    }

    closeViewModal.addEventListener('click', () => {
      viewRecipeModal.style.display = 'none';
      viewRecipeModal.setAttribute('aria-hidden', 'true');
      recipeDetailsEl.innerHTML = '';
    });

    function filterRecipes(query) {
      var q = (query || '').trim().toLowerCase();
      var diffFilter = difficultyFilter.value;
      var mealFilter = mealTypeFilter.value;
      var cards = recipeGrid.querySelectorAll('.recipe-card');

      cards.forEach(card => {
        var title = (card.querySelector('.card-content')?.textContent || '').toLowerCase();
        var isUserCard = card.classList.contains('user-card');
        var matches = true;

        if (q && !title.includes(q)) matches = false;

        if (diffFilter) {
          var cardDiff = isUserCard
            ? card.querySelector('.card-info div:first-child span')?.textContent || ''
            : card.getAttribute('data-difficulty') || '';
          if (cardDiff !== diffFilter) matches = false;
        }

        if (mealFilter) {
          var cardMeal = isUserCard
            ? card.querySelector('.card-info div:nth-child(2) span')?.textContent || ''
            : card.getAttribute('data-mealtype') || '';
          if (cardMeal !== mealFilter) matches = false;
        }

        card.style.display = matches ? 'block' : 'none';
      });
    }

    searchButton.addEventListener('click', () => filterRecipes(searchInput.value));
    searchInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') filterRecipes(searchInput.value);
      else filterRecipes(searchInput.value);
    });

    difficultyFilter.addEventListener('change', () => filterRecipes(searchInput.value));
    mealTypeFilter.addEventListener('change', () => filterRecipes(searchInput.value));

    profileBtn.addEventListener('click', () => {
      if (localStorage.getItem('currentUser')) {
        window.__navigateTo('profile.html');
      } else {
        window.__navigateTo('signin.html?redirect=profile.html');
      }
    });

    document.querySelectorAll('.recipe-card[data-link]').forEach(card => {
      var link = card.dataset.link;
      card.addEventListener('click', () => { window.__navigateTo(link); });
      card.addEventListener('keypress', (e) => { if (e.key === 'Enter') window.__navigateTo(link); });
    });

    reloadUserRecipes();

    window.addEventListener('click', (e) => {
      var target = e.target;
      if (target === addRecipeModal) {
        addRecipeModal.style.display = 'none';
        addRecipeModal.setAttribute('aria-hidden', 'true');
        addRecipeForm.reset();
        editingIndex = null;
      }
      if (target === viewRecipeModal) {
        viewRecipeModal.style.display = 'none';
        viewRecipeModal.setAttribute('aria-hidden', 'true');
        recipeDetailsEl.innerHTML = '';
      }
      if (target === signInModal) {
        signInModal.style.display = 'none';
        signInModal.setAttribute('aria-hidden', 'true');
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        [addRecipeModal, viewRecipeModal, signInModal].forEach(mod => {
          if (mod && mod.style.display === 'flex') {
            mod.style.display = 'none';
            mod.setAttribute('aria-hidden', 'true');
          }
        });
      }
    });

    (function preloadPlaceholder() {
      var img = new Image();
      img.src = 'placeholder.jpg';
    })();

  </script>

  <div id="viewRecipeModal" class="modal" aria-hidden="true">

        <button type="submit" class="btn">Sign In</button>

          style="background: #e74c3c; margin-left:8px; display:none;">Sign Out</button>
      </form>
      <p style="margin-top:12px; color:#444;">(This demo stores a signed-in username locally — no real authentication.)
      </p>
    </div>
  </div>

  <script>
    /************************************************************************
      Elements at data
     ************************************************************************/
    var addRecipeBtn = document.getElementById('addRecipeBtn');
    var addRecipeModal = document.getElementById('addRecipeModal');
    var closeAddModal = document.getElementById('closeAddModal');
    var addRecipeForm = document.getElementById('addRecipeForm');

    var viewRecipeModal = document.getElementById('viewRecipeModal');
    var closeViewModal = document.getElementById('closeViewModal');
    var recipeDetailsEl = document.getElementById('recipeDetails');

    var recipeGrid = document.getElementById('recipeGrid');

    var searchInput = document.getElementById('searchInput');
    var searchButton = document.getElementById('searchButton');

    var profileBtn = document.getElementById('profileBtn');
    var signInModal = document.getElementById('signInModal');
    var closeSignIn = document.getElementById('closeSignIn');
    var signInForm = document.getElementById('signInForm');
    var signOutBtn = document.getElementById('signOutBtn');
    var signinUsernameEl = document.getElementById('signinUsername');

    // user recipes stored in localStorage
    var userRecipes = JSON.parse(localStorage.getItem('userRecipes')) || [];
    // signed user (use shared currentUser from index.html)
    var currentUser = localStorage.getItem('currentUser');

    var editingIndex = null;

    var difficultyFilter = document.getElementById('difficultyFilter');
    var mealTypeFilter = document.getElementById('mealTypeFilter');

    function createRecipeCard(recipe, index = null) {
      var card = document.createElement('div');
      card.className = 'recipe-card';
      var isUser = !recipe.link;

      if (isUser) card.classList.add('user-card');

      var imgSrc = recipe.image && recipe.image.trim() ? recipe.image : 'placeholder.jpg';

      card.innerHTML = `
      <img src="${imgSrc}" alt="${escapeHtml(recipe.name)}">
      <div class="card-content">${escapeHtml(recipe.name)}</div>
      <div class="card-info">
        <div><img src="hat.png" alt=""><span>${isUser ? (recipe.difficulty || '—') : '—'}</span></div>
        <div><span>${isUser ? (recipe.mealType || '—') : '—'}</span></div>
      </div>
      <button class="favorite-button" data-title="${escapeHtml(recipe.name)}" data-desc="${escapeHtml(recipe.instructions || 'No description')}" data-category="Appetizers">${isFavorited(recipe.name) ? '♥' : '♡'}</button>
    `;

      if (isUser) {
        var del = document.createElement('button');
        del.className = 'delete-button';
        del.textContent = 'Delete';
        del.title = 'Delete recipe';
        del.onclick = function (e) {
          e.stopPropagation();
          deleteRecipe(index);
        };
        card.appendChild(del);

        var edit = document.createElement('button');
        edit.className = 'edit-button';
        edit.textContent = 'Edit';
        edit.title = 'Edit recipe';
        edit.onclick = function (e) {
          e.stopPropagation();
          editRecipe(index);
        };
        card.appendChild(edit);

        card.onclick = function () {
          showRecipeDetails({ name: recipe.name, image: imgSrc, instructions: recipe.instructions });
        };
      } else {
        card.dataset.link = recipe.link;
        card.tabIndex = 0;
        card.onclick = () => window.__navigateTo(recipe.link);
        card.onkeypress = (e) => { if (e.key === 'Enter') window.__navigateTo(recipe.link); };
      }

      var favBtn = card.querySelector('.favorite-button');
      favBtn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(favBtn);
      };

      return card;
    }


    function escapeHtml(str = '') {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function reloadUserRecipes() {
      var existingUserCards = Array.from(recipeGrid.querySelectorAll('.recipe-card.user-card'));
      existingUserCards.forEach(el => el.remove());

      userRecipes.forEach((r, i) => {
        var card = createRecipeCard(r, i);
        recipeGrid.appendChild(card);
      });
    }

    /************************************************************************
      Delete recipe
     ************************************************************************/
    function deleteRecipe(index) {
      userRecipes.splice(index, 1);
      localStorage.setItem('userRecipes', JSON.stringify(userRecipes));
      reloadUserRecipes();
    }

    /************************************************************************
      Edit recipe
     ************************************************************************/
    function editRecipe(index) {
      var recipe = userRecipes[index];
      document.getElementById('recipeName').value = recipe.name;
      document.getElementById('recipeImage').value = recipe.image;
      document.getElementById('recipeInstructions').value = recipe.instructions;
      document.getElementById('recipeDifficulty').value = recipe.difficulty || '';
      document.getElementById('recipeMealType').value = recipe.mealType || '';
      document.getElementById('addTitle').textContent = 'Edit Your Recipe';
      editingIndex = index;
      addRecipeModal.style.display = 'flex';
      addRecipeModal.setAttribute('aria-hidden', 'false');
    }

    /************************************************************************
      Favorite functions
     ************************************************************************/
    function isFavorited(title) { var user = localStorage.getItem('currentUser') || currentUser; if (!user) return false;
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];
      return savedRecipes.some(r => r.title === title);
    }

    function toggleFavorite(btn) {
      var user = localStorage.getItem('currentUser') || currentUser;
      if (!user) { window.__navigateTo('signin.html');
        return;
      }
      var title = btn.getAttribute('data-title');
      var desc = btn.getAttribute('data-desc');
      var category = btn.getAttribute('data-category');
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];

      var existingIndex = savedRecipes.findIndex(r => r.title === title);
      if (existingIndex > -1) {
        savedRecipes.splice(existingIndex, 1);
        btn.textContent = '♡';
        btn.classList.remove('favorited');
      } else {
        savedRecipes.push({ title, description: desc, category });
        btn.textContent = '♥';
        btn.classList.add('favorited');
      }
      localStorage.setItem(`savedRecipes_${currentUser}`, JSON.stringify(savedRecipes));
    }

    document.querySelectorAll('.favorite-button').forEach(btn => {
      var title = btn.getAttribute('data-title');
      if (isFavorited(title)) {
        btn.textContent = '♥';
        btn.classList.add('favorited');
      } else {
        btn.textContent = '♡';
        btn.classList.remove('favorited');
      }

      btn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(btn);
      };
    });

    /************************************************************************
      recipe form handler
     ************************************************************************/
    addRecipeBtn.addEventListener('click', () => {
      var user = localStorage.getItem('currentUser') || currentUser;
      if (!user) { window.__navigateTo('signin.html');
        return;
      }
      document.getElementById('addTitle').textContent = 'Add Your Recipe';
      editingIndex = null;
      addRecipeForm.reset();
      openAddModal();
    });

    function openAddModal() {
      addRecipeModal.style.display = 'flex';
      addRecipeModal.setAttribute('aria-hidden', 'false');
    }
    closeAddModal.addEventListener('click', () => {
      addRecipeModal.style.display = 'none';
      addRecipeModal.setAttribute('aria-hidden', 'true');
      addRecipeForm.reset();
      editingIndex = null;
    });

    addRecipeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      var name = document.getElementById('recipeName').value.trim();
      var image = document.getElementById('recipeImage').value.trim();
      var instructions = document.getElementById('recipeInstructions').value.trim();
      var difficulty = document.getElementById('recipeDifficulty').value;
      var mealType = document.getElementById('recipeMealType').value;

      if (!name || !instructions) {
        alert('Please provide at least a recipe name and instructions.');
        return;
      }

      var recipe = { name, image, instructions, difficulty, mealType };
      if (editingIndex !== null) {
        userRecipes[editingIndex] = recipe;
      } else {
        userRecipes.push(recipe);
      }
      localStorage.setItem('userRecipes', JSON.stringify(userRecipes));
      reloadUserRecipes();

      addRecipeModal.style.display = 'none';
      addRecipeForm.reset();
      editingIndex = null;
    });

    /************************************************************************
     recipe ni manong aeron
     ************************************************************************/
    function showRecipeDetails({ name, image, instructions }) {
      var imgSrc = image && image.trim() ? image : 'placeholder.jpg';
      recipeDetailsEl.innerHTML = `
      <img src="${imgSrc}" alt="${escapeHtml(name)}">
      <h3>${escapeHtml(name)}</h3>
      <p>${escapeHtml(instructions || 'No instructions provided.')}</p>
    `;
      viewRecipeModal.style.display = 'flex';
      viewRecipeModal.setAttribute('aria-hidden', 'false');
    }

    closeViewModal.addEventListener('click', () => {
      viewRecipeModal.style.display = 'none';
      viewRecipeModal.setAttribute('aria-hidden', 'true');
      recipeDetailsEl.innerHTML = '';
    });

    function filterRecipes(query) {
      var q = (query || '').trim().toLowerCase();
      var diffFilter = difficultyFilter.value;
      var mealFilter = mealTypeFilter.value;
      var cards = recipeGrid.querySelectorAll('.recipe-card');

      cards.forEach(card => {
        var title = (card.querySelector('.card-content')?.textContent || '').toLowerCase();
        var isUserCard = card.classList.contains('user-card');
        var matches = true;

        if (q && !title.includes(q)) matches = false;

        if (diffFilter) {
          var cardDiff = isUserCard
            ? card.querySelector('.card-info div:first-child span')?.textContent || ''
            : card.getAttribute('data-difficulty') || '';
          if (cardDiff !== diffFilter) matches = false;
        }

        if (mealFilter) {
          var cardMeal = isUserCard
            ? card.querySelector('.card-info div:nth-child(2) span')?.textContent || ''
            : card.getAttribute('data-mealtype') || '';
          if (cardMeal !== mealFilter) matches = false;
        }

        card.style.display = matches ? 'block' : 'none';
      });
    }

    searchButton.addEventListener('click', () => filterRecipes(searchInput.value));
    searchInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') filterRecipes(searchInput.value);
      else filterRecipes(searchInput.value);
    });

    difficultyFilter.addEventListener('change', () => filterRecipes(searchInput.value));
    mealTypeFilter.addEventListener('change', () => filterRecipes(searchInput.value));

    profileBtn.addEventListener('click', () => {
      if (localStorage.getItem('currentUser')) {
        window.__navigateTo('profile.html');
      } else {
        window.__navigateTo('signin.html?redirect=profile.html');
      }
    });

    document.querySelectorAll('.recipe-card[data-link]').forEach(card => {
      var link = card.dataset.link;
      card.addEventListener('click', () => { window.__navigateTo(link); });
      card.addEventListener('keypress', (e) => { if (e.key === 'Enter') window.__navigateTo(link); });
    });

    reloadUserRecipes();

    window.addEventListener('click', (e) => {
      var target = e.target;
      if (target === addRecipeModal) {
        addRecipeModal.style.display = 'none';
        addRecipeModal.setAttribute('aria-hidden', 'true');
        addRecipeForm.reset();
        editingIndex = null;
      }
      if (target === viewRecipeModal) {
        viewRecipeModal.style.display = 'none';
        viewRecipeModal.setAttribute('aria-hidden', 'true');
        recipeDetailsEl.innerHTML = '';
      }
      if (target === signInModal) {
        signInModal.style.display = 'none';
        signInModal.setAttribute('aria-hidden', 'true');
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        [addRecipeModal, viewRecipeModal, signInModal].forEach(mod => {
          if (mod && mod.style.display === 'flex') {
            mod.style.display = 'none';
            mod.setAttribute('aria-hidden', 'true');
          }
        });
      }
    });

    (function preloadPlaceholder() {
      var img = new Image();
      img.src = 'placeholder.jpg';
    })();

  </script>

    </div>
  </template>

  <template id="page-Brownies_html" data-page="Brownies.html" data-title="Brownies | TasteMatch" data-body-class="" data-body-style="">
    <style>

:root {
    --primary: #ff6b6b;
    --secondary: #ffd166;
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #6b7280;
}

body.dark {
    --bg: #0f172a;
    --card: #111827;
    --text: #e5e7eb;
    --muted: #9ca3af;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Inter", system-ui, sans-serif; background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }

header { background: linear-gradient(135deg, var(--primary), #ff8fa3); color: #fff; padding: 40px 20px; text-align: center; position: relative; }
header h1 { font-size: 2rem; font-weight: 800; }
.toggle { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 10px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; }

.recipe-container { max-width: 1100px; margin: 40px auto 60px; padding: 20px; }
.recipe-card { background: var(--card); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); overflow: hidden; }
.recipe-card img { border-radius: 16px; }

.recipe-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 40px; }
.recipe-hero img { width: 100%; height: 340px; object-fit: cover; }

.recipe-title { font-size: 2.6rem; font-weight: 800; }
.recipe-description { color: var(--muted); margin: 16px 0; }

.rating { display: flex; gap: 10px; font-size: 2.4rem; cursor: pointer; margin: 10px 0 18px; }
.star { color: #d1d5db; transition: transform 0.2s ease, color 0.2s ease; }
.star:hover { transform: scale(1.2); }
.star.active { color: #facc15; }

.badges { display: flex; gap: 12px; flex-wrap: wrap; }
.badge { background: var(--secondary); color: #92400e; padding: 8px 14px; border-radius: 999px; font-weight: 600; }

.recipe-content { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding: 40px; }
.section { background: rgba(0,0,0,0.03); border-radius: 16px; padding: 30px; }
body.dark .section { background: rgba(255,255,255,0.04); }

ul { list-style: none; }
ul li { padding-left: 26px; margin-bottom: 10px; position: relative; color: var(--muted); }
ul li::before { content: "✔"; position: absolute; left: 0; color: var(--primary); }

ol { padding-left: 20px; }
ol li { margin-bottom: 14px; color: var(--muted); }

.comments { padding: 0 40px 40px; }
.comment-form input, .comment-form textarea { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #ccc; }
.comment-form button { background: var(--primary); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
.comment { margin-top: 16px; padding: 14px; border-radius: 10px; background: rgba(0,0,0,0.04); position: relative; }
