    var searchButton = document.getElementById('searchButton');

    var profileBtn = document.getElementById('profileBtn');
    var signInModal = document.getElementById('signInModal');
    var closeSignIn = document.getElementById('closeSignIn');
    var signInForm = document.getElementById('signInForm');
    var signOutBtn = document.getElementById('signOutBtn');
    var signinUsernameEl = document.getElementById('signinUsername');

    // user recipes stored in localStorage
    var userRecipes = JSON.parse(localStorage.getItem('userRecipes')) || [];
    // signed user (use shared currentUser from index.html)
    var currentUser = localStorage.getItem('currentUser');

    var editingIndex = null;

    var difficultyFilter = document.getElementById('difficultyFilter');
    var mealTypeFilter = document.getElementById('mealTypeFilter');

    function createRecipeCard(recipe, index = null) {
      var card = document.createElement('div');
      card.className = 'recipe-card';
      var isUser = !recipe.link;

      if (isUser) card.classList.add('user-card');

      var imgSrc = recipe.image && recipe.image.trim() ? recipe.image : 'placeholder.jpg';

      card.innerHTML = `
      <img src="${imgSrc}" alt="${escapeHtml(recipe.name)}">
      <div class="card-content">${escapeHtml(recipe.name)}</div>
      <div class="card-info">
        <div><img src="hat.png" alt=""><span>${isUser ? (recipe.difficulty || '—') : '—'}</span></div>
        <div><span>${isUser ? (recipe.mealType || '—') : '—'}</span></div>
      </div>
      <button class="favorite-button" data-title="${escapeHtml(recipe.name)}" data-desc="${escapeHtml(recipe.instructions || 'No description')}" data-category="Appetizers">${isFavorited(recipe.name) ? '♥' : '♡'}</button>
    `;

      if (isUser) {
        var del = document.createElement('button');
        del.className = 'delete-button';
        del.textContent = 'Delete';
        del.title = 'Delete recipe';
        del.onclick = function (e) {
          e.stopPropagation();
          deleteRecipe(index);
        };
        card.appendChild(del);

        var edit = document.createElement('button');
        edit.className = 'edit-button';
        edit.textContent = 'Edit';
        edit.title = 'Edit recipe';
        edit.onclick = function (e) {
          e.stopPropagation();
          editRecipe(index);
        };
        card.appendChild(edit);

        card.onclick = function () {
          showRecipeDetails({ name: recipe.name, image: imgSrc, instructions: recipe.instructions });
        };
      } else {
        card.dataset.link = recipe.link;
        card.tabIndex = 0;
        card.onclick = () => window.__navigateTo(recipe.link);
        card.onkeypress = (e) => { if (e.key === 'Enter') window.__navigateTo(recipe.link); };
      }

      var favBtn = card.querySelector('.favorite-button');
      favBtn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(favBtn);
      };

      return card;
    }


    function escapeHtml(str = '') {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function reloadUserRecipes() {
      var existingUserCards = Array.from(recipeGrid.querySelectorAll('.recipe-card.user-card'));
      existingUserCards.forEach(el => el.remove());

      userRecipes.forEach((r, i) => {
        var card = createRecipeCard(r, i);
        recipeGrid.appendChild(card);
      });
    }

    /************************************************************************
      Delete recipe
     ************************************************************************/
    function deleteRecipe(index) {
      userRecipes.splice(index, 1);
      localStorage.setItem('userRecipes', JSON.stringify(userRecipes));
      reloadUserRecipes();
    }

    /************************************************************************
      Edit recipe
     ************************************************************************/
    function editRecipe(index) {
      var recipe = userRecipes[index];
      document.getElementById('recipeName').value = recipe.name;
      document.getElementById('recipeImage').value = recipe.image;
      document.getElementById('recipeInstructions').value = recipe.instructions;
      document.getElementById('recipeDifficulty').value = recipe.difficulty || '';
      document.getElementById('recipeMealType').value = recipe.mealType || '';
      document.getElementById('addTitle').textContent = 'Edit Your Recipe';
      editingIndex = index;
      addRecipeModal.style.display = 'flex';
      addRecipeModal.setAttribute('aria-hidden', 'false');
    }

    /************************************************************************
      Favorite functions
     ************************************************************************/
    function isFavorited(title) { var user = localStorage.getItem('currentUser') || currentUser; if (!user) return false;
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];
      return savedRecipes.some(r => r.title === title);
    }

    function toggleFavorite(btn) {
      var user = localStorage.getItem('currentUser') || currentUser;
      if (!user) { window.__navigateTo('signin.html');
        return;
      }
      var title = btn.getAttribute('data-title');
      var desc = btn.getAttribute('data-desc');
      var category = btn.getAttribute('data-category');
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];

      var existingIndex = savedRecipes.findIndex(r => r.title === title);
      if (existingIndex > -1) {
        savedRecipes.splice(existingIndex, 1);
        btn.textContent = '♡';
        btn.classList.remove('favorited');
      } else {
        savedRecipes.push({ title, description: desc, category });
        btn.textContent = '♥';
        btn.classList.add('favorited');
      }
      localStorage.setItem(`savedRecipes_${currentUser}`, JSON.stringify(savedRecipes));
    }

    document.querySelectorAll('.favorite-button').forEach(btn => {
      var title = btn.getAttribute('data-title');
      if (isFavorited(title)) {
        btn.textContent = '♥';
        btn.classList.add('favorited');
      } else {
        btn.textContent = '♡';
        btn.classList.remove('favorited');
      }

      btn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(btn);
      };
    });

    /************************************************************************
      recipe form handler
     ************************************************************************/
    addRecipeBtn.addEventListener('click', () => {
      var user = localStorage.getItem('currentUser') || currentUser;
      if (!user) { window.__navigateTo('signin.html');
        return;
      }
      document.getElementById('addTitle').textContent = 'Add Your Recipe';
      editingIndex = null;
      addRecipeForm.reset();
      openAddModal();
    });

    function openAddModal() {
      addRecipeModal.style.display = 'flex';
      addRecipeModal.setAttribute('aria-hidden', 'false');
    }
    closeAddModal.addEventListener('click', () => {
      addRecipeModal.style.display = 'none';
      addRecipeModal.setAttribute('aria-hidden', 'true');
      addRecipeForm.reset();
      editingIndex = null;
    });

    addRecipeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      var name = document.getElementById('recipeName').value.trim();
      var image = document.getElementById('recipeImage').value.trim();
      var instructions = document.getElementById('recipeInstructions').value.trim();
      var difficulty = document.getElementById('recipeDifficulty').value;
      var mealType = document.getElementById('recipeMealType').value;

      if (!name || !instructions) {
        alert('Please provide at least a recipe name and instructions.');
        return;
      }

      var recipe = { name, image, instructions, difficulty, mealType };
      if (editingIndex !== null) {
        userRecipes[editingIndex] = recipe;
      } else {
        userRecipes.push(recipe);
      }
      localStorage.setItem('userRecipes', JSON.stringify(userRecipes));
      reloadUserRecipes();

      addRecipeModal.style.display = 'none';
      addRecipeForm.reset();
      editingIndex = null;
    });

    /************************************************************************
     recipe ni manong aeron
     ************************************************************************/
    function showRecipeDetails({ name, image, instructions }) {
      var imgSrc = image && image.trim() ? image : 'placeholder.jpg';
      recipeDetailsEl.innerHTML = `
      <img src="${imgSrc}" alt="${escapeHtml(name)}">
      <h3>${escapeHtml(name)}</h3>
      <p>${escapeHtml(instructions || 'No instructions provided.')}</p>
    `;
      viewRecipeModal.style.display = 'flex';
      viewRecipeModal.setAttribute('aria-hidden', 'false');
    }

    closeViewModal.addEventListener('click', () => {
      viewRecipeModal.style.display = 'none';
      viewRecipeModal.setAttribute('aria-hidden', 'true');
      recipeDetailsEl.innerHTML = '';
    });

    function filterRecipes(query) {
      var q = (query || '').trim().toLowerCase();
      var diffFilter = difficultyFilter.value;
      var mealFilter = mealTypeFilter.value;
      var cards = recipeGrid.querySelectorAll('.recipe-card');

      cards.forEach(card => {
        var title = (card.querySelector('.card-content')?.textContent || '').toLowerCase();
        var isUserCard = card.classList.contains('user-card');
        var matches = true;

        if (q && !title.includes(q)) matches = false;

        if (diffFilter) {
          var cardDiff = isUserCard
            ? card.querySelector('.card-info div:first-child span')?.textContent || ''
            : card.getAttribute('data-difficulty') || '';
          if (cardDiff !== diffFilter) matches = false;
        }

        if (mealFilter) {
          var cardMeal = isUserCard
            ? card.querySelector('.card-info div:nth-child(2) span')?.textContent || ''
            : card.getAttribute('data-mealtype') || '';
          if (cardMeal !== mealFilter) matches = false;
        }

        card.style.display = matches ? 'block' : 'none';
      });
    }

    searchButton.addEventListener('click', () => filterRecipes(searchInput.value));
    searchInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') filterRecipes(searchInput.value);
      else filterRecipes(searchInput.value);
    });

    difficultyFilter.addEventListener('change', () => filterRecipes(searchInput.value));
    mealTypeFilter.addEventListener('change', () => filterRecipes(searchInput.value));

    profileBtn.addEventListener('click', () => {
      if (localStorage.getItem('currentUser')) {
        window.__navigateTo('profile.html');
      } else {
        window.__navigateTo('signin.html?redirect=profile.html');
      }
    });

    document.querySelectorAll('.recipe-card[data-link]').forEach(card => {
      var link = card.dataset.link;
      card.addEventListener('click', () => { window.__navigateTo(link); });
      card.addEventListener('keypress', (e) => { if (e.key === 'Enter') window.__navigateTo(link); });
    });

    reloadUserRecipes();

    window.addEventListener('click', (e) => {
      var target = e.target;
      if (target === addRecipeModal) {
        addRecipeModal.style.display = 'none';
        addRecipeModal.setAttribute('aria-hidden', 'true');
        addRecipeForm.reset();
        editingIndex = null;
      }
      if (target === viewRecipeModal) {
        viewRecipeModal.style.display = 'none';
        viewRecipeModal.setAttribute('aria-hidden', 'true');
        recipeDetailsEl.innerHTML = '';
      }
      if (target === signInModal) {
        signInModal.style.display = 'none';
        signInModal.setAttribute('aria-hidden', 'true');
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        [addRecipeModal, viewRecipeModal, signInModal].forEach(mod => {
          if (mod && mod.style.display === 'flex') {
            mod.style.display = 'none';
            mod.setAttribute('aria-hidden', 'true');
          }
        });
      }
    });

    (function preloadPlaceholder() {
      var img = new Image();
      img.src = 'placeholder.jpg';
    })();

  </script>

    </div>
  </template>

  <script>
    /************************************************************************
      Elements at data
     ************************************************************************/
    var addRecipeBtn = document.getElementById('addRecipeBtn');
    var addRecipeModal = document.getElementById('addRecipeModal');
    var closeAddModal = document.getElementById('closeAddModal');
    var addRecipeForm = document.getElementById('addRecipeForm');

    var viewRecipeModal = document.getElementById('viewRecipeModal');
    var closeViewModal = document.getElementById('closeViewModal');
    var recipeDetailsEl = document.getElementById('recipeDetails');

    var recipeGrid = document.getElementById('recipeGrid');

    var searchInput = document.getElementById('searchInput');
    var searchButton = document.getElementById('searchButton');

    var profileBtn = document.getElementById('profileBtn');
    var signInModal = document.getElementById('signInModal');
    var closeSignIn = document.getElementById('closeSignIn');
    var signInForm = document.getElementById('signInForm');
    var signOutBtn = document.getElementById('signOutBtn');
    var signinUsernameEl = document.getElementById('signinUsername');

    // user recipes stored in localStorage
    var userRecipes = JSON.parse(localStorage.getItem('userRecipes')) || [];
    // signed user (use shared currentUser from index.html)
    var currentUser = localStorage.getItem('currentUser');

    var editingIndex = null;

    var difficultyFilter = document.getElementById('difficultyFilter');
    var mealTypeFilter = document.getElementById('mealTypeFilter');

    function createRecipeCard(recipe, index = null) {
      var card = document.createElement('div');
      card.className = 'recipe-card';
      var isUser = !recipe.link;

      if (isUser) card.classList.add('user-card');

      var imgSrc = recipe.image && recipe.image.trim() ? recipe.image : 'placeholder.jpg';

      card.innerHTML = `
      <img src="${imgSrc}" alt="${escapeHtml(recipe.name)}">
      <div class="card-content">${escapeHtml(recipe.name)}</div>
      <div class="card-info">
        <div><img src="hat.png" alt=""><span>${isUser ? (recipe.difficulty || '—') : '—'}</span></div>
        <div><span>${isUser ? (recipe.mealType || '—') : '—'}</span></div>
      </div>
      <button class="favorite-button" data-title="${escapeHtml(recipe.name)}" data-desc="${escapeHtml(recipe.instructions || 'No description')}" data-category="Appetizers">${isFavorited(recipe.name) ? '♥' : '♡'}</button>
    `;

      if (isUser) {
        var del = document.createElement('button');
        del.className = 'delete-button';
        del.textContent = 'Delete';
        del.title = 'Delete recipe';
        del.onclick = function (e) {
          e.stopPropagation();
          deleteRecipe(index);
        };
        card.appendChild(del);

        var edit = document.createElement('button');
        edit.className = 'edit-button';
        edit.textContent = 'Edit';
        edit.title = 'Edit recipe';
        edit.onclick = function (e) {
          e.stopPropagation();
          editRecipe(index);
        };
        card.appendChild(edit);

        card.onclick = function () {
          showRecipeDetails({ name: recipe.name, image: imgSrc, instructions: recipe.instructions });
        };
      } else {
        card.dataset.link = recipe.link;
        card.tabIndex = 0;
        card.onclick = () => window.__navigateTo(recipe.link);
        card.onkeypress = (e) => { if (e.key === 'Enter') window.__navigateTo(recipe.link); };
      }

      var favBtn = card.querySelector('.favorite-button');
      favBtn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(favBtn);
      };

      return card;
    }


    function escapeHtml(str = '') {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function reloadUserRecipes() {
      var existingUserCards = Array.from(recipeGrid.querySelectorAll('.recipe-card.user-card'));
      existingUserCards.forEach(el => el.remove());

      userRecipes.forEach((r, i) => {
        var card = createRecipeCard(r, i);
        recipeGrid.appendChild(card);
      });
    }

    /************************************************************************
      Delete recipe
     ************************************************************************/
    function deleteRecipe(index) {
      userRecipes.splice(index, 1);
      localStorage.setItem('userRecipes', JSON.stringify(userRecipes));
      reloadUserRecipes();
    }

    /************************************************************************
      Edit recipe
     ************************************************************************/
    function editRecipe(index) {
      var recipe = userRecipes[index];
      document.getElementById('recipeName').value = recipe.name;
      document.getElementById('recipeImage').value = recipe.image;
      document.getElementById('recipeInstructions').value = recipe.instructions;
      document.getElementById('recipeDifficulty').value = recipe.difficulty || '';
      document.getElementById('recipeMealType').value = recipe.mealType || '';
      document.getElementById('addTitle').textContent = 'Edit Your Recipe';
      editingIndex = index;
      addRecipeModal.style.display = 'flex';
      addRecipeModal.setAttribute('aria-hidden', 'false');
    }

    /************************************************************************
      Favorite functions
     ************************************************************************/
    function isFavorited(title) { var user = localStorage.getItem('currentUser') || currentUser; if (!user) return false;
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];
      return savedRecipes.some(r => r.title === title);
    }

    function toggleFavorite(btn) {
      var user = localStorage.getItem('currentUser') || currentUser;
      if (!user) { window.__navigateTo('signin.html');
        return;
      }
      var title = btn.getAttribute('data-title');
      var desc = btn.getAttribute('data-desc');
      var category = btn.getAttribute('data-category');
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];

      var existingIndex = savedRecipes.findIndex(r => r.title === title);
      if (existingIndex > -1) {
        savedRecipes.splice(existingIndex, 1);
        btn.textContent = '♡';
        btn.classList.remove('favorited');
      } else {
        savedRecipes.push({ title, description: desc, category });
        btn.textContent = '♥';
        btn.classList.add('favorited');
      }
      localStorage.setItem(`savedRecipes_${currentUser}`, JSON.stringify(savedRecipes));
    }

    document.querySelectorAll('.favorite-button').forEach(btn => {
      var title = btn.getAttribute('data-title');
      if (isFavorited(title)) {
        btn.textContent = '♥';
        btn.classList.add('favorited');
      } else {
        btn.textContent = '♡';
        btn.classList.remove('favorited');
      }

      btn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(btn);
      };
    });

    /************************************************************************
      recipe form handler
     ************************************************************************/
    addRecipeBtn.addEventListener('click', () => {
      var user = localStorage.getItem('currentUser') || currentUser;
      if (!user) { window.__navigateTo('signin.html');
        return;
      }
      document.getElementById('addTitle').textContent = 'Add Your Recipe';
      editingIndex = null;
      addRecipeForm.reset();
      openAddModal();
    });

    function openAddModal() {
      addRecipeModal.style.display = 'flex';
      addRecipeModal.setAttribute('aria-hidden', 'false');
    }
    closeAddModal.addEventListener('click', () => {
      addRecipeModal.style.display = 'none';
      addRecipeModal.setAttribute('aria-hidden', 'true');
      addRecipeForm.reset();
      editingIndex = null;
    });

    addRecipeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      var name = document.getElementById('recipeName').value.trim();
      var image = document.getElementById('recipeImage').value.trim();
      var instructions = document.getElementById('recipeInstructions').value.trim();
      var difficulty = document.getElementById('recipeDifficulty').value;
      var mealType = document.getElementById('recipeMealType').value;

      if (!name || !instructions) {
        alert('Please provide at least a recipe name and instructions.');
        return;
      }

      var recipe = { name, image, instructions, difficulty, mealType };
      if (editingIndex !== null) {
        userRecipes[editingIndex] = recipe;
      } else {
        userRecipes.push(recipe);
      }
      localStorage.setItem('userRecipes', JSON.stringify(userRecipes));
      reloadUserRecipes();

      addRecipeModal.style.display = 'none';
      addRecipeForm.reset();
      editingIndex = null;
    });

    /************************************************************************
     recipe ni manong aeron
     ************************************************************************/
    function showRecipeDetails({ name, image, instructions }) {
      var imgSrc = image && image.trim() ? image : 'placeholder.jpg';
      recipeDetailsEl.innerHTML = `
      <img src="${imgSrc}" alt="${escapeHtml(name)}">
      <h3>${escapeHtml(name)}</h3>
      <p>${escapeHtml(instructions || 'No instructions provided.')}</p>
    `;
      viewRecipeModal.style.display = 'flex';
      viewRecipeModal.setAttribute('aria-hidden', 'false');
    }

    closeViewModal.addEventListener('click', () => {
      viewRecipeModal.style.display = 'none';
      viewRecipeModal.setAttribute('aria-hidden', 'true');
      recipeDetailsEl.innerHTML = '';
    });

    function filterRecipes(query) {
      var q = (query || '').trim().toLowerCase();
      var diffFilter = difficultyFilter.value;
      var mealFilter = mealTypeFilter.value;
      var cards = recipeGrid.querySelectorAll('.recipe-card');

      cards.forEach(card => {
        var title = (card.querySelector('.card-content')?.textContent || '').toLowerCase();
        var isUserCard = card.classList.contains('user-card');
        var matches = true;

        if (q && !title.includes(q)) matches = false;

        if (diffFilter) {
          var cardDiff = isUserCard
            ? card.querySelector('.card-info div:first-child span')?.textContent || ''
            : card.getAttribute('data-difficulty') || '';
          if (cardDiff !== diffFilter) matches = false;
        }

        if (mealFilter) {
          var cardMeal = isUserCard
            ? card.querySelector('.card-info div:nth-child(2) span')?.textContent || ''
            : card.getAttribute('data-mealtype') || '';
          if (cardMeal !== mealFilter) matches = false;
        }

        card.style.display = matches ? 'block' : 'none';
      });
    }

    searchButton.addEventListener('click', () => filterRecipes(searchInput.value));
    searchInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') filterRecipes(searchInput.value);
      else filterRecipes(searchInput.value);
    });

    difficultyFilter.addEventListener('change', () => filterRecipes(searchInput.value));
    mealTypeFilter.addEventListener('change', () => filterRecipes(searchInput.value));

    profileBtn.addEventListener('click', () => {
      if (localStorage.getItem('currentUser')) {
        window.__navigateTo('profile.html');
      } else {
        window.__navigateTo('signin.html?redirect=profile.html');
      }
    });

    document.querySelectorAll('.recipe-card[data-link]').forEach(card => {
      var link = card.dataset.link;
      card.addEventListener('click', () => { window.__navigateTo(link); });
      card.addEventListener('keypress', (e) => { if (e.key === 'Enter') window.__navigateTo(link); });
    });

    reloadUserRecipes();

    window.addEventListener('click', (e) => {
      var target = e.target;
      if (target === addRecipeModal) {
        addRecipeModal.style.display = 'none';
        addRecipeModal.setAttribute('aria-hidden', 'true');
        addRecipeForm.reset();
        editingIndex = null;
      }
      if (target === viewRecipeModal) {
        viewRecipeModal.style.display = 'none';
        viewRecipeModal.setAttribute('aria-hidden', 'true');
        recipeDetailsEl.innerHTML = '';
      }
      if (target === signInModal) {
        signInModal.style.display = 'none';
        signInModal.setAttribute('aria-hidden', 'true');
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        [addRecipeModal, viewRecipeModal, signInModal].forEach(mod => {
          if (mod && mod.style.display === 'flex') {
            mod.style.display = 'none';
            mod.setAttribute('aria-hidden', 'true');
          }
        });
      }
    });

    (function preloadPlaceholder() {
      var img = new Image();
      img.src = 'placeholder.jpg';
    })();

  </script>

    </div>
  </template>

    .section-title::after {
      content: "";
      display: block;
      margin: 14px auto 0;
      width: 110px;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-start), var(--accent-end));
      border-radius: 6px;
      box-shadow: 0 0 12px rgba(255, 166, 77, 0.55);
    }

    /* ===========================
       SEARCH BAR
    ============================ */
    .search-wrap {
      display: flex;
      justify-content: center;
      margin: 20px 0 0 0;
      padding: 0 16px;
    }

    .search-input {
      padding: 12px 14px;
      border-radius: 12px 0 0 12px;
      border: none;
      outline: none;
      width: min(680px, 70%);
      max-width: 900px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.95);
      color: #222;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
      border-right: 1px solid rgba(0, 0, 0, 0.06);
    }

    .search-button {
      padding: 12px 18px;
      border-radius: 0 12px 12px 0;
      border: none;
      background: linear-gradient(90deg, var(--accent-start), var(--accent-end));
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
      margin-left: -2px;
    }

    .search-button:hover {
      filter: brightness(.96);
      transform: translateY(-1px);
    }

    /* ===========================
       serep 
    ============================ */
    .recipe-grid {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 36px;
      padding: 36px 18px 80px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ===========================
       RECIPE CARDs 
    ============================ */
    .recipe-card {
      width: var(--card-width);
      height: var(--card-height);
      border-radius: 22px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition:
        transform 0.45s ease,
        filter 0.45s ease,
        box-shadow 0.45s ease;
    }

    .recipe-card:hover {
      transform: translateY(-10px) scale(1.03);
      filter: brightness(1.07);
      box-shadow: 0 26px 50px rgba(0, 0, 0, 0.45);
    }

    .recipe-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      position: relative;
      z-index: 1;
      transition: transform .5s ease;
    }

    .recipe-card:hover img {
      transform: scale(1.12);
    }

    .recipe-card::before {
      content: "";
      position: absolute;
      top: -150%;
      left: -150%;
      width: 280%;
      height: 280%;
      background: linear-gradient(120deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.4) 45%,
          rgba(255, 255, 255, 0) 80%);
      transform: rotate(25deg);
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
      z-index: 3;
    }

    .recipe-card:hover::before {
      opacity: 1;
      animation: shineSweep 1s ease forwards;
    }

    @keyframes shineSweep {
      from {
        transform: translate(-50%, -50%) rotate(25deg);
      }

      to {
        transform: translate(60%, 60%) rotate(25deg);
      }
    }

    .recipe-card::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0));
      z-index: 2;
    }

    /* card text */
    .card-content {
      position: absolute;
      bottom: 70px;
      left: 25px;
      right: 25px;
      color: white;
      font-size: 1.4rem;
      font-weight: 600;
      line-height: 1.2;
      text-shadow: 0px 3px 6px rgba(0, 0, 0, 0.45);
      z-index: 4;
    }

    .card-info {
      position: absolute;
      bottom: 18px;
      left: 25px;
      display: flex;
      gap: 20px;
      z-index: 4;
      align-items: center;
    }

    .card-info div {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .card-info img {
      width: 20px;
      height: 20px;
      object-fit: cover;
    }

    /* Favorite button */
    .favorite-button {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.8);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: background 0.3s;
    }

    .favorite-button:hover {
      background: rgba(255, 255, 255, 1);
    }

    .favorite-button.favorited {
      color: #ff6347;
    }

    .delete-button {
      position: absolute;
      top: 12px;
      right: 12px;
      background-color: rgba(231, 76, 60, 0.95);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: 700;
      z-index: 6;
      display: none;
    }

    .recipe-card.user-card:hover .delete-button {
      display: block;
      transform: translateY(-2px);
    }

    .edit-button {
      position: absolute;
      top: 12px;
      right: 70px;
      background-color: rgba(52, 152, 219, 0.95);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: 700;
      z-index: 6;
      display: none;
    }

    .recipe-card.user-card:hover .edit-button {
      display: block;
      transform: translateY(-2px);
    }

    .back-button {
      display: block;
      width: fit-content;
      margin: 32px auto 80px;
      background-color: #e74c3c;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .back-button:hover {
      background-color: #c0392b;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background-color: #fff;
      color: #111;
      margin: 20px;
      padding: 20px;
      border-radius: 12px;
      width: 92%;
      max-width: 640px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    .modal .close {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 28px;
      font-weight: bold;
      color: #555;
      cursor: pointer;
    }

    .modal form input[type="text"],
    .modal form input[type="url"],
    .modal form textarea,
    .modal form input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .modal form label {
      font-weight: 600;

    .modal form button[type="submit"],
    .modal .btn {
      margin-top: 14px;

    .recipe-details img {

    .recipe-details h3 {

    .recipe-details p {

    @media (max-width: 980px) {
      .card-content {
        font-size: 1.1rem;

    @media (max-width: 640px) {

      .card-content {

      }

      .card-info {
        left: 18px;

        font-size: 0.88rem;
      }
    }

    .filter-controls {
      display: flex;
      justify-content: center;

    .filter-controls select {

    </style>

          style="background: #e74c3c; margin-left:8px; display:none;">Sign Out</button>

  <script>
    /************************************************************************
      Elements at data
     ************************************************************************/
    var addRecipeBtn = document.getElementById('addRecipeBtn');
    var addRecipeModal = document.getElementById('addRecipeModal');
    var closeAddModal = document.getElementById('closeAddModal');
    var addRecipeForm = document.getElementById('addRecipeForm');

    var viewRecipeModal = document.getElementById('viewRecipeModal');
    var closeViewModal = document.getElementById('closeViewModal');
    var recipeDetailsEl = document.getElementById('recipeDetails');

    var recipeGrid = document.getElementById('recipeGrid');

    var searchInput = document.getElementById('searchInput');
    var searchButton = document.getElementById('searchButton');

    var profileBtn = document.getElementById('profileBtn');
    var signInModal = document.getElementById('signInModal');
    var closeSignIn = document.getElementById('closeSignIn');
    var signInForm = document.getElementById('signInForm');
    var signOutBtn = document.getElementById('signOutBtn');
    var signinUsernameEl = document.getElementById('signinUsername');

    // user recipes stored in localStorage
    var userRecipes = JSON.parse(localStorage.getItem('userRecipes')) || [];
    // signed user (use shared currentUser from index.html)
    var currentUser = localStorage.getItem('currentUser');

    var editingIndex = null;

    var difficultyFilter = document.getElementById('difficultyFilter');
    var mealTypeFilter = document.getElementById('mealTypeFilter');

    function createRecipeCard(recipe, index = null) {
      var card = document.createElement('div');
      card.className = 'recipe-card';
      var isUser = !recipe.link;

      if (isUser) card.classList.add('user-card');

      var imgSrc = recipe.image && recipe.image.trim() ? recipe.image : 'placeholder.jpg';

      card.innerHTML = `
      <img src="${imgSrc}" alt="${escapeHtml(recipe.name)}">
      <div class="card-content">${escapeHtml(recipe.name)}</div>
      <div class="card-info">
        <div><img src="hat.png" alt=""><span>${isUser ? (recipe.difficulty || '—') : '—'}</span></div>
        <div><span>${isUser ? (recipe.mealType || '—') : '—'}</span></div>
      </div>
      <button class="favorite-button" data-title="${escapeHtml(recipe.name)}" data-desc="${escapeHtml(recipe.instructions || 'No description')}" data-category="Appetizers">${isFavorited(recipe.name) ? '♥' : '♡'}</button>
    `;

      if (isUser) {
        var del = document.createElement('button');
        del.className = 'delete-button';
        del.textContent = 'Delete';
        del.title = 'Delete recipe';
        del.onclick = function (e) {
          e.stopPropagation();
          deleteRecipe(index);
        };
        card.appendChild(del);

        var edit = document.createElement('button');
        edit.className = 'edit-button';
        edit.textContent = 'Edit';
        edit.title = 'Edit recipe';
        edit.onclick = function (e) {
          e.stopPropagation();
          editRecipe(index);
        };
        card.appendChild(edit);

        card.onclick = function () {
          showRecipeDetails({ name: recipe.name, image: imgSrc, instructions: recipe.instructions });
        };
      } else {
        card.dataset.link = recipe.link;
        card.tabIndex = 0;
        card.onclick = () => window.__navigateTo(recipe.link);
        card.onkeypress = (e) => { if (e.key === 'Enter') window.__navigateTo(recipe.link); };
      }

      var favBtn = card.querySelector('.favorite-button');
      favBtn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(favBtn);
      };

      return card;
    }


    function escapeHtml(str = '') {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function reloadUserRecipes() {
      var existingUserCards = Array.from(recipeGrid.querySelectorAll('.recipe-card.user-card'));
      existingUserCards.forEach(el => el.remove());

      userRecipes.forEach((r, i) => {
        var card = createRecipeCard(r, i);
        recipeGrid.appendChild(card);
      });
    }

    /************************************************************************
      Delete recipe
     ************************************************************************/
    function deleteRecipe(index) {
      userRecipes.splice(index, 1);
      localStorage.setItem('userRecipes', JSON.stringify(userRecipes));
      reloadUserRecipes();
    }

    /************************************************************************
      Edit recipe
     ************************************************************************/
    function editRecipe(index) {
      var recipe = userRecipes[index];
      document.getElementById('recipeName').value = recipe.name;
      document.getElementById('recipeImage').value = recipe.image;
      document.getElementById('recipeInstructions').value = recipe.instructions;
      document.getElementById('recipeDifficulty').value = recipe.difficulty || '';
      document.getElementById('recipeMealType').value = recipe.mealType || '';
      document.getElementById('addTitle').textContent = 'Edit Your Recipe';
      editingIndex = index;
      addRecipeModal.style.display = 'flex';
      addRecipeModal.setAttribute('aria-hidden', 'false');
    }

    /************************************************************************
      Favorite functions
     ************************************************************************/
    function isFavorited(title) { var user = localStorage.getItem('currentUser') || currentUser; if (!user) return false;
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];
      return savedRecipes.some(r => r.title === title);
    }

    function toggleFavorite(btn) {
      var user = localStorage.getItem('currentUser') || currentUser;
      if (!user) { window.__navigateTo('signin.html');
        return;
      }
      var title = btn.getAttribute('data-title');
      var desc = btn.getAttribute('data-desc');
      var category = btn.getAttribute('data-category');
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];

      var existingIndex = savedRecipes.findIndex(r => r.title === title);
      if (existingIndex > -1) {
        savedRecipes.splice(existingIndex, 1);
        btn.textContent = '♡';
        btn.classList.remove('favorited');
      } else {
        savedRecipes.push({ title, description: desc, category });
        btn.textContent = '♥';
        btn.classList.add('favorited');
      }
      localStorage.setItem(`savedRecipes_${currentUser}`, JSON.stringify(savedRecipes));
    }

    document.querySelectorAll('.favorite-button').forEach(btn => {
      var title = btn.getAttribute('data-title');
      if (isFavorited(title)) {
        btn.textContent = '♥';
        btn.classList.add('favorited');
      } else {
        btn.textContent = '♡';
        btn.classList.remove('favorited');
      }

      btn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(btn);
      };
    });

    /************************************************************************
      recipe form handler
     ************************************************************************/
    addRecipeBtn.addEventListener('click', () => {
      var user = localStorage.getItem('currentUser') || currentUser;
      if (!user) { window.__navigateTo('signin.html');
        return;
      }
      document.getElementById('addTitle').textContent = 'Add Your Recipe';
      editingIndex = null;
      addRecipeForm.reset();
      openAddModal();
    });

    function openAddModal() {
      addRecipeModal.style.display = 'flex';
      addRecipeModal.setAttribute('aria-hidden', 'false');
    }
    closeAddModal.addEventListener('click', () => {
      addRecipeModal.style.display = 'none';
      addRecipeModal.setAttribute('aria-hidden', 'true');
      addRecipeForm.reset();
      editingIndex = null;
    });

    addRecipeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      var name = document.getElementById('recipeName').value.trim();
      var image = document.getElementById('recipeImage').value.trim();
      var instructions = document.getElementById('recipeInstructions').value.trim();
      var difficulty = document.getElementById('recipeDifficulty').value;
      var mealType = document.getElementById('recipeMealType').value;

      if (!name || !instructions) {
        alert('Please provide at least a recipe name and instructions.');
        return;
      }

        card.style.display = matches ? 'block' : 'none';

    var userRecipes = JSON.parse(localStorage.getItem('userRecipes')) || [];
    // signed user (use shared currentUser from index.html)
    var currentUser = localStorage.getItem('currentUser');

    var editingIndex = null;

    var difficultyFilter = document.getElementById('difficultyFilter');
    var mealTypeFilter = document.getElementById('mealTypeFilter');

    function createRecipeCard(recipe, index = null) {
      var card = document.createElement('div');
      card.className = 'recipe-card';
      var isUser = !recipe.link;

      if (isUser) card.classList.add('user-card');

      var imgSrc = recipe.image && recipe.image.trim() ? recipe.image : 'placeholder.jpg';

      card.innerHTML = `
      <img src="${imgSrc}" alt="${escapeHtml(recipe.name)}">
      <div class="card-content">${escapeHtml(recipe.name)}</div>
      <div class="card-info">
        <div><img src="hat.png" alt=""><span>${isUser ? (recipe.difficulty || '—') : '—'}</span></div>
        <div><span>${isUser ? (recipe.mealType || '—') : '—'}</span></div>
      </div>
      <button class="favorite-button" data-title="${escapeHtml(recipe.name)}" data-desc="${escapeHtml(recipe.instructions || 'No description')}" data-category="Appetizers">${isFavorited(recipe.name) ? '♥' : '♡'}</button>
    `;

      if (isUser) {
        var del = document.createElement('button');
        del.className = 'delete-button';
        del.textContent = 'Delete';
        del.title = 'Delete recipe';
        del.onclick = function (e) {
          e.stopPropagation();
          deleteRecipe(index);
        };
        card.appendChild(del);

        var edit = document.createElement('button');
        edit.className = 'edit-button';
        edit.textContent = 'Edit';
        edit.title = 'Edit recipe';
        edit.onclick = function (e) {
          e.stopPropagation();
          editRecipe(index);
        };
        card.appendChild(edit);

        card.onclick = function () {
          showRecipeDetails({ name: recipe.name, image: imgSrc, instructions: recipe.instructions });
        };
      } else {
        card.dataset.link = recipe.link;
        card.tabIndex = 0;
        card.onclick = () => window.__navigateTo(recipe.link);
        card.onkeypress = (e) => { if (e.key === 'Enter') window.__navigateTo(recipe.link); };
      }

      var favBtn = card.querySelector('.favorite-button');
      favBtn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(favBtn);
      };

      return card;
    }


    function escapeHtml(str = '') {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function reloadUserRecipes() {
      var existingUserCards = Array.from(recipeGrid.querySelectorAll('.recipe-card.user-card'));
      existingUserCards.forEach(el => el.remove());

      userRecipes.forEach((r, i) => {
        var card = createRecipeCard(r, i);
        recipeGrid.appendChild(card);
      });
    }

    /************************************************************************
      Delete recipe
     ************************************************************************/
    function deleteRecipe(index) {
      userRecipes.splice(index, 1);
      localStorage.setItem('userRecipes', JSON.stringify(userRecipes));
      reloadUserRecipes();
    }

    /************************************************************************
      Edit recipe
     ************************************************************************/
    function editRecipe(index) {
      var recipe = userRecipes[index];
      document.getElementById('recipeName').value = recipe.name;
      document.getElementById('recipeImage').value = recipe.image;
      document.getElementById('recipeInstructions').value = recipe.instructions;
      document.getElementById('recipeDifficulty').value = recipe.difficulty || '';
      document.getElementById('recipeMealType').value = recipe.mealType || '';
      document.getElementById('addTitle').textContent = 'Edit Your Recipe';
      editingIndex = index;
      addRecipeModal.style.display = 'flex';
      addRecipeModal.setAttribute('aria-hidden', 'false');
    }

    /************************************************************************
      Favorite functions
     ************************************************************************/
    function isFavorited(title) { var user = localStorage.getItem('currentUser') || currentUser; if (!user) return false;
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];
      return savedRecipes.some(r => r.title === title);
    }

    function toggleFavorite(btn) {
      var user = localStorage.getItem('currentUser') || currentUser;
      if (!user) { window.__navigateTo('signin.html');
        return;
      }
      var title = btn.getAttribute('data-title');
      var desc = btn.getAttribute('data-desc');
      var category = btn.getAttribute('data-category');
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];

      var existingIndex = savedRecipes.findIndex(r => r.title === title);
      if (existingIndex > -1) {
        savedRecipes.splice(existingIndex, 1);
        btn.textContent = '♡';
        btn.classList.remove('favorited');
      } else {
        savedRecipes.push({ title, description: desc, category });
        btn.textContent = '♥';
        btn.classList.add('favorited');
      }
      localStorage.setItem(`savedRecipes_${currentUser}`, JSON.stringify(savedRecipes));
    }

    document.querySelectorAll('.favorite-button').forEach(btn => {
      var title = btn.getAttribute('data-title');
      if (isFavorited(title)) {
        btn.textContent = '♥';
        btn.classList.add('favorited');
      } else {
        btn.textContent = '♡';
        btn.classList.remove('favorited');
      }

      btn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(btn);
      };
    });

    /************************************************************************
      recipe form handler
     ************************************************************************/
    addRecipeBtn.addEventListener('click', () => {
      var user = localStorage.getItem('currentUser') || currentUser;
      if (!user) { window.__navigateTo('signin.html');
        return;
      }
      document.getElementById('addTitle').textContent = 'Add Your Recipe';
      editingIndex = null;
      addRecipeForm.reset();
      openAddModal();
    });

    function openAddModal() {
      addRecipeModal.style.display = 'flex';
      addRecipeModal.setAttribute('aria-hidden', 'false');
    }
    closeAddModal.addEventListener('click', () => {
      addRecipeModal.style.display = 'none';
      addRecipeModal.setAttribute('aria-hidden', 'true');
      addRecipeForm.reset();
      editingIndex = null;
    });

    addRecipeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      var name = document.getElementById('recipeName').value.trim();
      var image = document.getElementById('recipeImage').value.trim();
      var instructions = document.getElementById('recipeInstructions').value.trim();
      var difficulty = document.getElementById('recipeDifficulty').value;
      var mealType = document.getElementById('recipeMealType').value;

      if (!name || !instructions) {
        alert('Please provide at least a recipe name and instructions.');
        return;
      }

      var recipe = { name, image, instructions, difficulty, mealType };
      if (editingIndex !== null) {
        userRecipes[editingIndex] = recipe;
      } else {
        userRecipes.push(recipe);
      }
      localStorage.setItem('userRecipes', JSON.stringify(userRecipes));
      reloadUserRecipes();

      addRecipeModal.style.display = 'none';
      addRecipeForm.reset();
      editingIndex = null;
    });

    /************************************************************************
     recipe ni manong aeron
     ************************************************************************/
    function showRecipeDetails({ name, image, instructions }) {
      var imgSrc = image && image.trim() ? image : 'placeholder.jpg';
      recipeDetailsEl.innerHTML = `
      <img src="${imgSrc}" alt="${escapeHtml(name)}">
      <h3>${escapeHtml(name)}</h3>
      <p>${escapeHtml(instructions || 'No instructions provided.')}</p>
    `;
      viewRecipeModal.style.display = 'flex';
      viewRecipeModal.setAttribute('aria-hidden', 'false');
    }

    closeViewModal.addEventListener('click', () => {
      viewRecipeModal.style.display = 'none';
      viewRecipeModal.setAttribute('aria-hidden', 'true');
      recipeDetailsEl.innerHTML = '';
    });

    function filterRecipes(query) {
      var q = (query || '').trim().toLowerCase();
      var diffFilter = difficultyFilter.value;
      var mealFilter = mealTypeFilter.value;
      var cards = recipeGrid.querySelectorAll('.recipe-card');

      cards.forEach(card => {
        var title = (card.querySelector('.card-content')?.textContent || '').toLowerCase();
        var isUserCard = card.classList.contains('user-card');
        var matches = true;

        if (q && !title.includes(q)) matches = false;

        if (diffFilter) {
          var cardDiff = isUserCard
            ? card.querySelector('.card-info div:first-child span')?.textContent || ''
            : card.getAttribute('data-difficulty') || '';
          if (cardDiff !== diffFilter) matches = false;
        }

        if (mealFilter) {
          var cardMeal = isUserCard
            ? card.querySelector('.card-info div:nth-child(2) span')?.textContent || ''
            : card.getAttribute('data-mealtype') || '';
          if (cardMeal !== mealFilter) matches = false;
        }

        card.style.display = matches ? 'block' : 'none';
      });
    }

    searchButton.addEventListener('click', () => filterRecipes(searchInput.value));
    searchInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') filterRecipes(searchInput.value);
      else filterRecipes(searchInput.value);
    });

    difficultyFilter.addEventListener('change', () => filterRecipes(searchInput.value));
    mealTypeFilter.addEventListener('change', () => filterRecipes(searchInput.value));

    profileBtn.addEventListener('click', () => {
      if (localStorage.getItem('currentUser')) {
        window.__navigateTo('profile.html');
      } else {
        window.__navigateTo('signin.html?redirect=profile.html');
      }
    });

    document.querySelectorAll('.recipe-card[data-link]').forEach(card => {
      var link = card.dataset.link;
      card.addEventListener('click', () => { window.__navigateTo(link); });
      card.addEventListener('keypress', (e) => { if (e.key === 'Enter') window.__navigateTo(link); });
    });

    reloadUserRecipes();

    window.addEventListener('click', (e) => {
      var target = e.target;
      if (target === addRecipeModal) {
        addRecipeModal.style.display = 'none';
        addRecipeModal.setAttribute('aria-hidden', 'true');
        addRecipeForm.reset();
        editingIndex = null;
      }
      if (target === viewRecipeModal) {
        viewRecipeModal.style.display = 'none';
        viewRecipeModal.setAttribute('aria-hidden', 'true');
        recipeDetailsEl.innerHTML = '';
      }
      if (target === signInModal) {
        signInModal.style.display = 'none';
        signInModal.setAttribute('aria-hidden', 'true');
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        [addRecipeModal, viewRecipeModal, signInModal].forEach(mod => {
          if (mod && mod.style.display === 'flex') {
            mod.style.display = 'none';
            mod.setAttribute('aria-hidden', 'true');
          }
        });
      }
    });

    (function preloadPlaceholder() {
      var img = new Image();
      img.src = 'placeholder.jpg';
    })();

  </script>

    </div>
  </template>

<script>

}

}

var recipeCard = document.querySelector(".recipe-card");

/* STAR RATING */
var stars = document.querySelectorAll(".star");
var rating = localStorage.getItem(`rating_${recipeId}`) || 0;

function updateStars(value) {
    stars.forEach(star => {
        star.classList.toggle("active", star.dataset.value <= value);

}

        updateStars(rating);
    });
});

updateStars(rating);

</script>

    .filter-controls {

  <div id="viewRecipeModal" class="modal" aria-hidden="true">

  <div id="signInModal" class="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="signinTitle">
      <span class="close" id="closeSignIn" title="Close">&times;</span>
      <h3 id="signinTitle">Sign In</h3>

        <label for="signinUsername">Username</label>

        <button type="submit" class="btn">Sign In</button>

          style="background: #e74c3c; margin-left:8px; display:none;">Sign Out</button>
      </form>
      <p style="margin-top:12px; color:#444;">(This demo stores a signed-in username locally — no real authentication.)
      </p>
    </div>
  </div>

  <script>
    /************************************************************************
      Elements at data
     ************************************************************************/
    var addRecipeBtn = document.getElementById('addRecipeBtn');
    var addRecipeModal = document.getElementById('addRecipeModal');
    var closeAddModal = document.getElementById('closeAddModal');
    var addRecipeForm = document.getElementById('addRecipeForm');

    var viewRecipeModal = document.getElementById('viewRecipeModal');
    var closeViewModal = document.getElementById('closeViewModal');
    var recipeDetailsEl = document.getElementById('recipeDetails');

    var recipeGrid = document.getElementById('recipeGrid');

    var searchInput = document.getElementById('searchInput');
    var searchButton = document.getElementById('searchButton');

    var profileBtn = document.getElementById('profileBtn');
    var signInModal = document.getElementById('signInModal');
    var closeSignIn = document.getElementById('closeSignIn');
    var signInForm = document.getElementById('signInForm');
    var signOutBtn = document.getElementById('signOutBtn');
    var signinUsernameEl = document.getElementById('signinUsername');

    // user recipes stored in localStorage
    var userRecipes = JSON.parse(localStorage.getItem('userRecipes')) || [];
    // signed user (use shared currentUser from index.html)
    var currentUser = localStorage.getItem('currentUser');

    var editingIndex = null;

    var difficultyFilter = document.getElementById('difficultyFilter');
    var mealTypeFilter = document.getElementById('mealTypeFilter');

    function createRecipeCard(recipe, index = null) {
      var card = document.createElement('div');
      card.className = 'recipe-card';
      var isUser = !recipe.link;

      if (isUser) card.classList.add('user-card');

      var imgSrc = recipe.image && recipe.image.trim() ? recipe.image : 'placeholder.jpg';

      card.innerHTML = `
      <img src="${imgSrc}" alt="${escapeHtml(recipe.name)}">
      <div class="card-content">${escapeHtml(recipe.name)}</div>
      <div class="card-info">
        <div><img src="hat.png" alt=""><span>${isUser ? (recipe.difficulty || '—') : '—'}</span></div>
        <div><span>${isUser ? (recipe.mealType || '—') : '—'}</span></div>
      </div>
      <button class="favorite-button" data-title="${escapeHtml(recipe.name)}" data-desc="${escapeHtml(recipe.instructions || 'No description')}" data-category="Appetizers">${isFavorited(recipe.name) ? '♥' : '♡'}</button>
    `;

      if (isUser) {
        var del = document.createElement('button');
        del.className = 'delete-button';
        del.textContent = 'Delete';
        del.title = 'Delete recipe';
        del.onclick = function (e) {
          e.stopPropagation();
          deleteRecipe(index);
        };
        card.appendChild(del);

        var edit = document.createElement('button');
        edit.className = 'edit-button';
        edit.textContent = 'Edit';
        edit.title = 'Edit recipe';
        edit.onclick = function (e) {
          e.stopPropagation();
          editRecipe(index);
        };
        card.appendChild(edit);

        card.onclick = function () {
          showRecipeDetails({ name: recipe.name, image: imgSrc, instructions: recipe.instructions });
        };
      } else {
        card.dataset.link = recipe.link;
        card.tabIndex = 0;
        card.onclick = () => window.__navigateTo(recipe.link);
        card.onkeypress = (e) => { if (e.key === 'Enter') window.__navigateTo(recipe.link); };
      }

      var favBtn = card.querySelector('.favorite-button');
      favBtn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(favBtn);
      };

      return card;
    }


    function escapeHtml(str = '') {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function reloadUserRecipes() {
      var existingUserCards = Array.from(recipeGrid.querySelectorAll('.recipe-card.user-card'));
      existingUserCards.forEach(el => el.remove());

      userRecipes.forEach((r, i) => {
        var card = createRecipeCard(r, i);
        recipeGrid.appendChild(card);
      });
    }

    /************************************************************************
      Delete recipe
     ************************************************************************/
    function deleteRecipe(index) {
      userRecipes.splice(index, 1);
      localStorage.setItem('userRecipes', JSON.stringify(userRecipes));
      reloadUserRecipes();
    }

    /************************************************************************
      Edit recipe
     ************************************************************************/
    function editRecipe(index) {
      var recipe = userRecipes[index];
      document.getElementById('recipeName').value = recipe.name;
      document.getElementById('recipeImage').value = recipe.image;
      document.getElementById('recipeInstructions').value = recipe.instructions;
      document.getElementById('recipeDifficulty').value = recipe.difficulty || '';
      document.getElementById('recipeMealType').value = recipe.mealType || '';
      document.getElementById('addTitle').textContent = 'Edit Your Recipe';
      editingIndex = index;
      addRecipeModal.style.display = 'flex';
      addRecipeModal.setAttribute('aria-hidden', 'false');
    }

    /************************************************************************
      Favorite functions
     ************************************************************************/
    function isFavorited(title) { var user = localStorage.getItem('currentUser') || currentUser; if (!user) return false;
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];
      return savedRecipes.some(r => r.title === title);
    }

    function toggleFavorite(btn) {
      var user = localStorage.getItem('currentUser') || currentUser;
      if (!user) { window.__navigateTo('signin.html');
        return;
      }
      var title = btn.getAttribute('data-title');
      var desc = btn.getAttribute('data-desc');
      var category = btn.getAttribute('data-category');
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];

      var existingIndex = savedRecipes.findIndex(r => r.title === title);
      if (existingIndex > -1) {
        savedRecipes.splice(existingIndex, 1);
        btn.textContent = '♡';
        btn.classList.remove('favorited');
      } else {
        savedRecipes.push({ title, description: desc, category });
        btn.textContent = '♥';
        btn.classList.add('favorited');
      }
      localStorage.setItem(`savedRecipes_${currentUser}`, JSON.stringify(savedRecipes));
    }

    document.querySelectorAll('.favorite-button').forEach(btn => {
      var title = btn.getAttribute('data-title');
      if (isFavorited(title)) {
        btn.textContent = '♥';
        btn.classList.add('favorited');
      } else {
        btn.textContent = '♡';
        btn.classList.remove('favorited');
      }

      btn.onclick = (e) => {
        e.stopPropagation();
        toggleFavorite(btn);
      };
    });

    /************************************************************************
      recipe form handler
     ************************************************************************/
    addRecipeBtn.addEventListener('click', () => {
      var user = localStorage.getItem('currentUser') || currentUser;
      if (!user) { window.__navigateTo('signin.html');
        return;
      }
      document.getElementById('addTitle').textContent = 'Add Your Recipe';
      editingIndex = null;
      addRecipeForm.reset();
      openAddModal();
    });

    function openAddModal() {
      addRecipeModal.style.display = 'flex';
      addRecipeModal.setAttribute('aria-hidden', 'false');
    }
    closeAddModal.addEventListener('click', () => {
      addRecipeModal.style.display = 'none';
      addRecipeModal.setAttribute('aria-hidden', 'true');
      addRecipeForm.reset();
      editingIndex = null;
    });

    addRecipeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      var name = document.getElementById('recipeName').value.trim();
      var image = document.getElementById('recipeImage').value.trim();
      var instructions = document.getElementById('recipeInstructions').value.trim();
      var difficulty = document.getElementById('recipeDifficulty').value;
      var mealType = document.getElementById('recipeMealType').value;

      if (!name || !instructions) {
        alert('Please provide at least a recipe name and instructions.');
        return;
      }

      var recipe = { name, image, instructions, difficulty, mealType };
      if (editingIndex !== null) {
        userRecipes[editingIndex] = recipe;
      } else {
        userRecipes.push(recipe);
      }
      localStorage.setItem('userRecipes', JSON.stringify(userRecipes));
      reloadUserRecipes();

      addRecipeModal.style.display = 'none';
      addRecipeForm.reset();
      editingIndex = null;
    });

    /************************************************************************
     recipe ni manong aeron
     ************************************************************************/
    function showRecipeDetails({ name, image, instructions }) {
      var imgSrc = image && image.trim() ? image : 'placeholder.jpg';
      recipeDetailsEl.innerHTML = `
      <img src="${imgSrc}" alt="${escapeHtml(name)}">
      <h3>${escapeHtml(name)}</h3>
      <p>${escapeHtml(instructions || 'No instructions provided.')}</p>
    `;
      viewRecipeModal.style.display = 'flex';
      viewRecipeModal.setAttribute('aria-hidden', 'false');
    }

    closeViewModal.addEventListener('click', () => {
      viewRecipeModal.style.display = 'none';
      viewRecipeModal.setAttribute('aria-hidden', 'true');
      recipeDetailsEl.innerHTML = '';
    });

    function filterRecipes(query) {
      var q = (query || '').trim().toLowerCase();
      var diffFilter = difficultyFilter.value;
      var mealFilter = mealTypeFilter.value;
      var cards = recipeGrid.querySelectorAll('.recipe-card');

      cards.forEach(card => {
        var title = (card.querySelector('.card-content')?.textContent || '').toLowerCase();
        var isUserCard = card.classList.contains('user-card');
        var matches = true;

        if (q && !title.includes(q)) matches = false;

        if (diffFilter) {
          var cardDiff = isUserCard
            ? card.querySelector('.card-info div:first-child span')?.textContent || ''
            : card.getAttribute('data-difficulty') || '';
          if (cardDiff !== diffFilter) matches = false;
        }

        if (mealFilter) {
          var cardMeal = isUserCard
            ? card.querySelector('.card-info div:nth-child(2) span')?.textContent || ''
            : card.getAttribute('data-mealtype') || '';
          if (cardMeal !== mealFilter) matches = false;
        }

        card.style.display = matches ? 'block' : 'none';
      });
    }

    searchButton.addEventListener('click', () => filterRecipes(searchInput.value));
    searchInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') filterRecipes(searchInput.value);
      else filterRecipes(searchInput.value);
    });

    difficultyFilter.addEventListener('change', () => filterRecipes(searchInput.value));
    mealTypeFilter.addEventListener('change', () => filterRecipes(searchInput.value));

    profileBtn.addEventListener('click', () => {
      if (localStorage.getItem('currentUser')) {
        window.__navigateTo('profile.html');
      } else {
        window.__navigateTo('signin.html?redirect=profile.html');
      }
    });

    document.querySelectorAll('.recipe-card[data-link]').forEach(card => {
      var link = card.dataset.link;
      card.addEventListener('click', () => { window.__navigateTo(link); });
      card.addEventListener('keypress', (e) => { if (e.key === 'Enter') window.__navigateTo(link); });
    });

    reloadUserRecipes();

    window.addEventListener('click', (e) => {
      var target = e.target;
      if (target === addRecipeModal) {
        addRecipeModal.style.display = 'none';
        addRecipeModal.setAttribute('aria-hidden', 'true');
        addRecipeForm.reset();
        editingIndex = null;
      }
      if (target === viewRecipeModal) {
        viewRecipeModal.style.display = 'none';
        viewRecipeModal.setAttribute('aria-hidden', 'true');
        recipeDetailsEl.innerHTML = '';
      }
      if (target === signInModal) {
        signInModal.style.display = 'none';
        signInModal.setAttribute('aria-hidden', 'true');
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        [addRecipeModal, viewRecipeModal, signInModal].forEach(mod => {
          if (mod && mod.style.display === 'flex') {
            mod.style.display = 'none';
            mod.setAttribute('aria-hidden', 'true');
          }
        });
      }
    });

    (function preloadPlaceholder() {
      var img = new Image();
      img.src = 'placeholder.jpg';
    })();

  </script>

    </div>
  </template>

  <template id="page-Spring_html" data-page="Spring.html" data-title="Spring Rolls | TasteMatch" data-body-class="" data-body-style="">
    <style>

:root {
    --primary: #ff6b6b;
    --secondary: #ffd166;
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #6b7280;
}

body.dark {
    --bg: #0f172a;
    --card: #111827;
    --text: #e5e7eb;
    --muted: #9ca3af;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Inter", system-ui, sans-serif; background: var(--bg); color: var(--text); transition: background 0.3s, color 0.3s; }

header { background: linear-gradient(135deg, var(--primary), #ff8fa3); color: #fff; padding: 40px 20px; text-align: center; position: relative; }
header h1 { font-size: 2rem; font-weight: 800; }
.toggle { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 10px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; }

.recipe-container { max-width: 1100px; margin: 40px auto 60px; padding: 20px; }
.recipe-card { background: var(--card); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); overflow: hidden; }
.recipe-card img { border-radius: 16px; }

.recipe-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 40px; }
.recipe-hero img { width: 100%; height: 340px; object-fit: cover; }

.recipe-title { font-size: 2.6rem; font-weight: 800; }
.recipe-description { color: var(--muted); margin: 16px 0; }

.rating { display: flex; gap: 10px; font-size: 2.4rem; cursor: pointer; margin: 10px 0 18px; }
.star { color: #d1d5db; transition: transform 0.2s ease, color 0.2s ease; }
.star:hover { transform: scale(1.2); }

  document.body.classList.toggle("dark");
  document.body.style.transform="scale(1.01)";

  f.style.left=Math.random()*100+"vw";
  f.style.fontSize=(20+Math.random()*25)+"px";
  var duration=3000+Math.random()*15000;
  f.style.animationDuration=duration+"ms";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),duration);
}

  <script>
    var currentUser = localStorage.getItem('currentUser');
    var currentUserEmail = localStorage.getItem('currentUserEmail');

    var profileLink = document.getElementById('profile-link');

    function updateAuthUI(user) {
      if (user) {
        currentUser = user.displayName || (user.email ? user.email.split('@')[0] : 'User');
        currentUserEmail = user.email || '';
        profileLink.innerHTML = `👤 ${currentUser}`;
      } else {
        currentUser = null;
        currentUserEmail = null;
        profileLink.innerHTML = '👤 Sign In';
      }
    }

    // Listen to Firebase auth changes
    if (typeof auth !== 'undefined' && auth) {
      auth.onAuthStateChanged((user) => {
        updateAuthUI(user);
      });
    } else {
      updateAuthUI(currentUser ? { displayName: currentUser, email: currentUserEmail } : null);
    }

    profileLink.onclick = (e) => {
      e.preventDefault();
      if (currentUser) {
        window.__navigateTo('profile.html');
      } else {
        window.__navigateTo('signin.html?redirect=profile.html');
      }
    };

    function saveRecipe(title, description, category, url) {
      if (!currentUser) {
        alert('Please sign in to save recipes!');
        window.__navigateTo('signin.html?redirect=index.html');
        return;
      }
      var savedRecipes = JSON.parse(localStorage.getItem(`savedRecipes_${currentUser}`)) || [];
      savedRecipes.push({ title, description, category, url });
      localStorage.setItem(`savedRecipes_${currentUser}`, JSON.stringify(savedRecipes));
      alert('Recipe saved! View it anytime in your Profile & Account dashboard.');
    }

    document.querySelectorAll('.save-recipe-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        var title = btn.getAttribute('data-title');
        var desc = btn.getAttribute('data-desc');
        var category = btn.getAttribute('data-category');
        var url = btn.getAttribute('data-url');
        saveRecipe(title, desc, category, url);
      });
    });
